<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eudaimon — Art Cards</title>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
  background: #070707;
  overflow: hidden;
  font-family: 'Georgia', serif;
  cursor: none;
  user-select: none;
}

/* ── Custom cursor ── */
#cursor {
  position: fixed; width: 6px; height: 6px;
  background: rgba(255,255,255,0.85); border-radius: 50%;
  pointer-events: none; z-index: 9999;
  transform: translate(-50%,-50%);
}
#cursor-ring {
  position: fixed; width: 36px; height: 36px;
  border: 1px solid rgba(255,255,255,0.22); border-radius: 50%;
  pointer-events: none; z-index: 9998;
  transform: translate(-50%,-50%);
  transition: width 0.22s, height 0.22s, border-color 0.3s;
}

/* ── Cards ── */
.card {
  position: absolute;
  width: 158px; height: 218px;
  border-radius: 11px;
  border: 1px solid rgba(255,255,255,0.065);
  background: rgba(11,11,11,0.94);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 18px;
  pointer-events: all;
  will-change: transform;
  overflow: hidden;
  transition: border-color 0.35s;
  perspective: 600px;
}
.card::before {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(145deg, rgba(255,255,255,0.025) 0%, transparent 60%);
  border-radius: inherit; pointer-events: none;
}
.card.hovered { border-color: rgba(255,255,255,0.14); }
.card.grabbed { border-color: rgba(140,210,255,0.35); z-index: 500 !important; }

.card-label {
  font-size: 8px; letter-spacing: 0.26em;
  color: rgba(255,255,255,0.18); text-transform: uppercase;
  font-family: 'Courier New', monospace; position: absolute;
  bottom: 16px; left: 0; right: 0; text-align: center;
}
.card-index {
  font-size: 7px; letter-spacing: 0.15em;
  color: rgba(255,255,255,0.08); font-family: 'Courier New', monospace;
  position: absolute; top: 14px; left: 16px;
}
.card-text {
  color: rgba(255,255,255,0.72); font-size: 12px;
  line-height: 1.65; text-align: center; padding: 0 20px;
  letter-spacing: 0.04em;
}
.card-text.serif { font-family:'Georgia',serif; font-style:italic; }
.card-text.mono  { font-family:'Courier New',monospace; font-size:10px; letter-spacing:0.1em; }
.card-symbol {
  font-size: 44px; color: rgba(255,255,255,0.65);
  line-height: 1; font-family: 'Georgia', serif;
}
.card-field { position: absolute; inset: 0; border-radius: inherit; opacity: 0.85; }

/* ── Webcam pip ── */
#cam-wrap {
  position: fixed; bottom: 24px; right: 24px;
  width: 200px; height: 150px;
  border-radius: 12px; overflow: hidden;
  border: 1px solid rgba(255,255,255,0.07);
  z-index: 200;
  transition: opacity 0.5s;
}
#cam-wrap:hover { opacity: 0.95 !important; }
#cam-video {
  position: absolute; width: 100%; height: 100%;
  object-fit: cover; transform: scaleX(-1);
  opacity: 0.55;
}
#cam-canvas {
  position: absolute; width: 100%; height: 100%;
  transform: scaleX(-1);
}
#cam-status {
  position: absolute; top: 8px; left: 10px;
  font-family: 'Courier New', monospace; font-size: 7px;
  letter-spacing: 0.15em; color: rgba(255,255,255,0.35);
}
#cam-status .dot {
  display: inline-block; width: 4px; height: 4px;
  border-radius: 50%; background: rgba(100,220,100,0.7);
  margin-right: 5px; vertical-align: middle;
  animation: blink 1.4s infinite;
}
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }

/* ── Hand pointer overlay (full screen) ── */
#hand-pointer {
  position: fixed; pointer-events: none; z-index: 150;
  width: 16px; height: 16px; border-radius: 50%;
  transform: translate(-50%,-50%);
  border: 1px solid rgba(140,210,255,0.5);
  transition: width 0.15s, height 0.15s, border-color 0.2s;
  display: none;
}
#hand-pointer::after {
  content: '';
  position: absolute; inset: 3px; border-radius: 50%;
  background: rgba(140,210,255,0.25);
}

/* ── Gesture badge ── */
#gesture-badge {
  position: fixed; top: 28px; right: 28px;
  font-family: 'Courier New', monospace; font-size: 9px;
  letter-spacing: 0.22em; color: rgba(255,255,255,0.18);
  text-align: right; pointer-events: none;
  transition: color 0.3s;
}
#gesture-badge .gval { color: rgba(140,210,255,0.6); }

/* ── Wordmark ── */
#wordmark {
  position: fixed; top: 28px; left: 28px; pointer-events: none;
}
#wordmark h1 {
  font-size: 11px; font-weight: 400; letter-spacing: 0.32em;
  color: rgba(255,255,255,0.35); font-family: 'Courier New', monospace;
}
#wordmark p {
  font-size: 8px; letter-spacing: 0.18em;
  color: rgba(255,255,255,0.1); margin-top: 4px;
  font-family: 'Courier New', monospace;
}

/* ── Arrangement label ── */
#arr-label {
  position: fixed; bottom: 28px; left: 28px;
  font-family: 'Courier New', monospace; font-size: 8px;
  letter-spacing: 0.2em; color: rgba(255,255,255,0.15);
  pointer-events: none;
}

/* ── Permission overlay ── */
#perm-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.85);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 18px;
  z-index: 1000; transition: opacity 0.6s;
}
#perm-overlay h2 {
  font-family: 'Courier New', monospace; font-size: 11px;
  letter-spacing: 0.28em; color: rgba(255,255,255,0.6);
  font-weight: 400;
}
#perm-overlay p {
  font-family: 'Courier New', monospace; font-size: 9px;
  letter-spacing: 0.16em; color: rgba(255,255,255,0.25);
}
#perm-btn {
  margin-top: 8px;
  background: none; border: 1px solid rgba(255,255,255,0.15);
  color: rgba(255,255,255,0.5); font-family: 'Courier New', monospace;
  font-size: 9px; letter-spacing: 0.2em; padding: 10px 28px;
  border-radius: 4px; cursor: pointer; transition: all 0.25s;
}
#perm-btn:hover {
  border-color: rgba(140,210,255,0.4); color: rgba(140,210,255,0.8);
}
#skip-btn {
  background: none; border: none; cursor: pointer;
  font-family: 'Courier New', monospace; font-size: 8px;
  letter-spacing: 0.16em; color: rgba(255,255,255,0.15);
}
#skip-btn:hover { color: rgba(255,255,255,0.3); }
</style>
</head>
<body>

<!-- Permission overlay -->
<div id="perm-overlay">
  <h2>EUDAIMON</h2>
  <p>Hand tracking requires camera access</p>
  <button id="perm-btn">ENABLE CAMERA</button>
  <button id="skip-btn">Continue without camera</button>
</div>

<div id="cursor"></div>
<div id="cursor-ring"></div>
<div id="hand-pointer"></div>

<div id="wordmark">
  <h1>Eudaimon</h1>
  <p>Visual System · 2026</p>
</div>

<div id="gesture-badge">
  GESTURE &nbsp;<span class="gval" id="gval">—</span><br>
  ARRANGEMENT &nbsp;<span class="gval" id="arrval">DRIFT</span>
</div>

<div id="arr-label">
  SPACE scatter · DBL-CLICK cycle · 1-6 arrange
</div>

<!-- Webcam PIP -->
<div id="cam-wrap" style="opacity:0">
  <video id="cam-video" autoplay muted playsinline></video>
  <canvas id="cam-canvas"></canvas>
  <div id="cam-status"><span class="dot"></span>TRACKING</div>
</div>

<div id="stage"></div>

<script>
const TAU = Math.PI * 2;
let W = innerWidth, H = innerHeight, cx = W/2, cy = H/2;

// ─── State ───────────────────────────────────────────────────────────────────

const pointer = { x: cx, y: cy, px: cx, py: cy, vx:0, vy:0, speed:0 };
let frame = 0, loopT = 0;
let pullMode = false;
let currentArrangement = 'drift';
let grabbedCard = null;
let handActive = false;
let gestureHold = 0, lastGesture = 'none', committedGesture = 'none';
let scatterImpulse = 0;

// ─── Card definitions ────────────────────────────────────────────────────────

const CARD_DEFS = [
  { type:'svg', label:'Vesica Piscis',
    svg:`<svg viewBox="-70 -50 140 100" width="88" height="62" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="0.8">
      <circle cx="-18" cy="0" r="36"/><circle cx="18" cy="0" r="36"/></svg>` },
  { type:'svg', label:'Flower of Life',
    svg:`<svg viewBox="-70 -70 140 140" width="88" height="88" fill="none" stroke="rgba(255,255,255,0.42)" stroke-width="0.7">
      <circle cx="0" cy="0" r="22"/><circle cx="0" cy="-22" r="22"/>
      <circle cx="0" cy="22" r="22"/><circle cx="19" cy="-11" r="22"/>
      <circle cx="19" cy="11" r="22"/><circle cx="-19" cy="-11" r="22"/>
      <circle cx="-19" cy="11" r="22"/>
      <circle cx="0" cy="0" r="44" opacity="0.25"/></svg>` },
  { type:'svg', label:"Metatron's Cube",
    svg:`<svg viewBox="-72 -72 144 144" width="88" height="88" fill="none" stroke="rgba(255,255,255,0.38)" stroke-width="0.65">
      ${[0,1,2,3,4,5].map(i=>{const a=i*TAU/6,r=36;return`<circle cx="${+(Math.cos(a)*r).toFixed(1)}" cy="${+(Math.sin(a)*r).toFixed(1)}" r="${r}"/>`}).join('')}
      <circle cx="0" cy="0" r="36"/>
      <polygon points="${[0,1,2,3,4,5].map(i=>{const a=i*TAU/6;return`${+(Math.cos(a)*36).toFixed(1)},${+(Math.sin(a)*36).toFixed(1)}`}).join(' ')}" stroke-width="0.5"/>
      <polygon points="${[0,1,2,3,4,5].map(i=>{const a=i*TAU/6+TAU/12;return`${+(Math.cos(a)*36).toFixed(1)},${+(Math.sin(a)*36).toFixed(1)}`}).join(' ')}" stroke-width="0.5"/>
    </svg>` },
  { type:'svg', label:'Sri Yantra',
    svg:`<svg viewBox="-62 -62 124 124" width="88" height="88" fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="0.75">
      ${[38,28,20,13].map((r,i)=>`<polygon points="${[0,1,2].map(k=>{const a=(i%2===0?-TAU/12:TAU/12)+k*TAU/3;return`${+(Math.cos(a)*r).toFixed(1)},${+(Math.sin(a)*r).toFixed(1)}`}).join(' ')}"/>`).join('')}
      <circle cx="0" cy="0" r="3" fill="rgba(255,255,255,0.35)" stroke="none"/>
      <circle cx="0" cy="0" r="54" stroke-width="0.4" opacity="0.25"/></svg>` },
  { type:'svg', label:'Torus',
    svg:`<svg viewBox="-62 -62 124 124" width="88" height="88" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="0.7">
      <ellipse cx="0" cy="0" rx="54" ry="28"/>
      <ellipse cx="0" cy="0" rx="54" ry="54" opacity="0.2"/>
      <ellipse cx="0" cy="0" rx="20" ry="28"/>
      <ellipse cx="0" cy="-14" rx="34" ry="14" opacity="0.45"/>
      <ellipse cx="0" cy="14" rx="34" ry="14" opacity="0.45"/></svg>` },
  { type:'svg', label:'Fibonacci',
    svg:`<svg viewBox="-55 -55 110 110" width="88" height="88" fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="0.75">
      <path d="M 0,0 A 8,8 0 0,1 8,0 A 13,13 0 0,0 8,-13 A 21,21 0 0,1 -13,-13 A 34,34 0 0,0 -13,21 A 55,55 0 0,1 42,21"/>
      <circle cx="0" cy="0" r="1.5" fill="rgba(255,255,255,0.45)" stroke="none"/></svg>` },
  { type:'svg', label:'Eye of Providence',
    svg:`<svg viewBox="-62 -42 124 84" width="88" height="60" fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="0.75">
      <path d="M -54,0 Q 0,-36 54,0 Q 0,36 -54,0 Z"/>
      <circle cx="0" cy="0" r="17"/>
      <circle cx="0" cy="0" r="6" fill="rgba(255,255,255,0.25)" stroke="none"/>
      <circle cx="5" cy="-5" r="2.5" fill="rgba(255,255,255,0.5)" stroke="none"/></svg>` },
  { type:'svg', label:'Triquetra',
    svg:`<svg viewBox="-55 -55 110 110" width="88" height="88" fill="none" stroke="rgba(255,255,255,0.42)" stroke-width="0.75">
      <path d="M 0,-38 A 32,32 0 0,1 33,19 A 32,32 0 0,1 -33,19 A 32,32 0 0,1 0,-38 Z"/>
      <circle cx="0" cy="0" r="22" opacity="0.3"/>
      <circle cx="0" cy="-38" r="5" fill="none" opacity="0.5"/>
      <circle cx="33" cy="19" r="5" fill="none" opacity="0.5"/>
      <circle cx="-33" cy="19" r="5" fill="none" opacity="0.5"/></svg>` },

  // Text
  { type:'text', label:'Thesis', serif:true,
    text:'"The money is made owning bottlenecks, not end products."' },
  { type:'text', label:'Doctrine', mono:true,
    text:'OWN THE\nCHOKEPOINT\nNOT THE\nPRODUCT' },
  { type:'text', label:'State', mono:true,
    text:'CONSCIOUSNESS\nLEVEL 32.25\n\nCOSMIC\nTRANSCENDENCE' },
  { type:'text', label:'Prediction', mono:true,
    text:'88.2%\nACCURACY\n\n76 ACTIVE\nPREDICTIONS' },

  // Symbols
  { type:'symbol', label:'Infinity', symbol:'∞' },
  { type:'symbol', label:'Delta',    symbol:'Δ' },
  { type:'symbol', label:'Omega',    symbol:'Ω' },
  { type:'symbol', label:'Phi',      symbol:'φ' },

  // Color fields
  { type:'field', label:'Deep Space', gradient:'linear-gradient(160deg,#0a1628,#0d2441,#071220)' },
  { type:'field', label:'Amber Void', gradient:'linear-gradient(150deg,#1a0e00,#2a1a00,#0f0800)' },
  { type:'field', label:'Aether',     gradient:'linear-gradient(135deg,#08080e,#0e0e1a,#060610)' },
];

// ─── Build cards ─────────────────────────────────────────────────────────────

const stage = document.getElementById('stage');
const cards = [];

function buildCards() {
  CARD_DEFS.forEach((def, i) => {
    const el = document.createElement('div');
    el.className = 'card';

    const idx = document.createElement('div');
    idx.className = 'card-index';
    idx.textContent = String(i+1).padStart(2,'0');
    el.appendChild(idx);

    if (def.type === 'svg') {
      el.innerHTML += def.svg;
    } else if (def.type === 'text') {
      const t = document.createElement('div');
      t.className = 'card-text' + (def.serif?' serif':'') + (def.mono?' mono':'');
      t.innerHTML = def.text.replace(/\n/g,'<br>');
      el.appendChild(t);
    } else if (def.type === 'symbol') {
      const s = document.createElement('div');
      s.className = 'card-symbol';
      s.textContent = def.symbol;
      el.appendChild(s);
    } else if (def.type === 'field') {
      const f = document.createElement('div');
      f.className = 'card-field';
      f.style.background = def.gradient;
      el.appendChild(f);
    }

    const lbl = document.createElement('div');
    lbl.className = 'card-label';
    lbl.textContent = def.label.toUpperCase();
    el.appendChild(lbl);

    stage.appendChild(el);

    const angle = (i / CARD_DEFS.length) * TAU;
    const r     = Math.min(W,H) * 0.27;
    const card  = {
      el, def, i,
      x: cx + Math.cos(angle)*r,
      y: cy + Math.sin(angle)*r,
      hx: cx + Math.cos(angle)*r,
      hy: cy + Math.sin(angle)*r,
      vx:0, vy:0,
      rotX:0, rotY:0, rotZ:0,
      scale:1,
      depth: 0.8 + Math.random()*0.4,
      phase: Math.random()*TAU,
      floatAmp: 4 + Math.random()*6,
      floatFreq: 0.003 + Math.random()*0.004,
    };
    cards.push(card);
  });
}

// ─── Arrangements ────────────────────────────────────────────────────────────

const arrangements = {
  drift(cards, t) {
    cards.forEach((c,i) => {
      const a = (i/cards.length)*TAU + t*0.00012;
      const r = Math.min(W,H)*0.27;
      c.hx = cx + Math.cos(a)*r;
      c.hy = cy + Math.sin(a)*r;
    });
  },
  grid(cards) {
    const cols = Math.ceil(Math.sqrt(cards.length));
    const rows = Math.ceil(cards.length/cols);
    const pw=180, ph=250;
    const ox = -(cols-1)*pw/2, oy = -(rows-1)*ph/2;
    cards.forEach((c,i) => {
      c.hx = cx + ox + (i%cols)*pw;
      c.hy = cy + oy + Math.floor(i/cols)*ph;
      c.rotZ = 0;
    });
  },
  fan(cards) {
    const n = cards.length;
    const fw = Math.min(W*0.88, n*50);
    cards.forEach((c,i) => {
      const p = n>1 ? i/(n-1) : 0.5;
      c.hx = cx - fw/2 + p*fw;
      c.hy = cy*1.12 + Math.sin(p*Math.PI)*-H*0.16;
      c.rotZ = (p-0.5)*30;
    });
  },
  stack(cards) {
    cards.forEach((c,i) => {
      c.hx = cx + (i-cards.length/2)*2.2;
      c.hy = cy + (i-cards.length/2)*1.2;
      c.rotZ = (i-cards.length/2)*3.5;
    });
  },
  spiral(cards) {
    cards.forEach((c,i) => {
      const a = i*0.72*TAU;
      const r = 20 + i*17;
      c.hx = cx + Math.cos(a)*r;
      c.hy = cy + Math.sin(a)*r;
      c.rotZ = 0;
    });
  },
  diagonal(cards) {
    const n = cards.length;
    cards.forEach((c,i) => {
      const p = i/(n-1);
      c.hx = W*0.11 + p*W*0.78;
      c.hy = H*0.14 + p*H*0.72;
      c.rotZ = -10 + p*20;
    });
  },
};

const ARR_KEYS = Object.keys(arrangements);
let arrIdx = 0;

function setArrangement(name) {
  currentArrangement = name;
  // clear rotZ for clean layouts
  if (['grid','drift','spiral'].includes(name))
    cards.forEach(c => { c.rotZ = 0; });
  document.getElementById('arrval').textContent = name.toUpperCase();
}

// ─── Physics ─────────────────────────────────────────────────────────────────

const K = 0.055, DMP = 0.78;

function tick(t) {
  arrangements[currentArrangement](cards, t);
  const mx = pointer.x, my = pointer.y;
  const spd = pointer.speed;

  cards.forEach(c => {
    if (c === grabbedCard) {
      // Grabbed: follow pointer directly
      c.vx = (mx - c.x) * 0.35;
      c.vy = (my - c.y) * 0.35;
      c.x += c.vx; c.y += c.vy;
      c.rotX = c.rotX * 0.85;
      c.rotY = c.rotY * 0.85;
      c.scale = c.scale * 0.9 + 1.08 * 0.1;
    } else {
      // Spring toward home
      c.vx = (c.vx + (c.hx - c.x) * K * (0.7 + 0.5*c.depth)) * DMP;
      c.vy = (c.vy + (c.hy - c.y) * K * (0.7 + 0.5*c.depth)) * DMP;

      // Mouse/hand influence
      const dx = mx - c.x, dy = my - c.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      const infl = Math.max(0, 1 - dist/220);

      if (pullMode && infl > 0.1) {
        c.vx += dx * 0.035 * infl;
        c.vy += dy * 0.035 * infl;
      } else if (spd > 3.5 && infl > 0.04) {
        const ang = Math.atan2(dy, dx);
        const push = spd * 0.22 * infl;
        c.vx -= Math.cos(ang) * push;
        c.vy -= Math.sin(ang) * push;
      }

      c.x += c.vx; c.y += c.vy;

      // 3D tilt
      const tilt = Math.min(infl * 16, 11);
      c.rotX = c.rotX * 0.88 + (-((my - cy)/(H/2)) * tilt) * 0.12;
      c.rotY = c.rotY * 0.88 + ( ((mx - cx)/(W/2)) * tilt) * 0.12;
      c.scale = c.scale * 0.93 + (1 + infl*0.05) * 0.07;
    }

    // Float
    const fx = Math.cos(t*c.floatFreq + c.phase) * c.floatAmp * 0.4;
    const fy = Math.sin(t*c.floatFreq*1.3 + c.phase) * c.floatAmp;

    const near = Math.sqrt((mx-c.x)**2 + (my-c.y)**2) < 220;
    c.el.classList.toggle('hovered', near && c !== grabbedCard);
    c.el.classList.toggle('grabbed', c === grabbedCard);

    c.el.style.transform =
      `translate(calc(${c.x+fx}px - 50%), calc(${c.y+fy}px - 50%))
       rotateX(${c.rotX.toFixed(2)}deg)
       rotateY(${c.rotY.toFixed(2)}deg)
       rotateZ(${c.rotZ.toFixed(2)}deg)
       scale(${c.scale.toFixed(4)})`;
    c.el.style.opacity  = (0.5 + c.depth * 0.5).toFixed(2);
    c.el.style.zIndex   = Math.round(c.depth * 10 + (c === grabbedCard ? 200 : 0));
  });
}

// ─── Nearest card ────────────────────────────────────────────────────────────

function nearestCard(x, y, maxDist=160) {
  let best = null, bestD = maxDist;
  cards.forEach(c => {
    const d = Math.sqrt((c.x-x)**2 + (c.y-y)**2);
    if (d < bestD) { bestD = d; best = c; }
  });
  return best;
}

// ─── Scatter ─────────────────────────────────────────────────────────────────

function scatter() {
  cards.forEach(c => {
    const ang = Math.atan2(c.y - pointer.y, c.x - pointer.x);
    const f   = 7 + Math.random()*10;
    c.vx += Math.cos(ang)*f; c.vy += Math.sin(ang)*f;
  });
}

// ─── Cursor ──────────────────────────────────────────────────────────────────

const cursorEl = document.getElementById('cursor');
const ringEl   = document.getElementById('cursor-ring');
const handPtr  = document.getElementById('hand-pointer');
let curX=cx,curY=cy,rX=cx,rY=cy;

function moveCursor() {
  curX += (pointer.x - curX)*0.9; curY += (pointer.y - curY)*0.9;
  rX   += (pointer.x - rX)*0.16;  rY   += (pointer.y - rY)*0.16;
  cursorEl.style.left = curX+'px'; cursorEl.style.top = curY+'px';
  ringEl.style.left   = rX+'px';   ringEl.style.top  = rY+'px';
  ringEl.style.width  = ringEl.style.height =
    pullMode ? '60px' : pointer.speed > 4 ? '18px' : '36px';
  ringEl.style.borderColor =
    pullMode ? 'rgba(140,210,255,0.4)' : 'rgba(255,255,255,0.22)';
}

// ─── Hand tracking (MediaPipe) ────────────────────────────────────────────────

const videoEl  = document.getElementById('cam-video');
const camCanvas = document.getElementById('cam-canvas');
const camCtx   = camCanvas.getContext('2d');

const CONNECTIONS = [
  [0,1],[1,2],[2,3],[3,4],
  [0,5],[5,6],[6,7],[7,8],
  [0,9],[9,10],[10,11],[11,12],
  [0,13],[13,14],[14,15],[15,16],
  [0,17],[17,18],[18,19],[19,20],
  [5,9],[9,13],[13,17],
];

function detectGesture(lm) {
  const ext = (tip, mcp) => lm[tip].y < lm[mcp].y - 0.04;
  const ie = ext(8,5), me = ext(12,9), re = ext(16,13), pe = ext(20,17);
  const spread = [ie,me,re,pe].filter(Boolean).length;
  const td = Math.hypot(lm[4].x-lm[8].x, lm[4].y-lm[8].y);
  if (td < 0.065) return spread >= 3 ? 'ok' : 'pinch';
  if (ie && pe && !me && !re) return 'rock';
  if (ie && me && !re && !pe)  return 'peace';
  if (ie && !me && !re && !pe) return 'point';
  if (spread === 4) return 'open';
  if (spread === 0) return 'fist';
  return 'none';
}

const GESTURE_ARR = {
  open:'drift', fist:'stack', peace:'grid',
  rock:'fan', point:'spiral', ok:'diagonal',
};

function onHandResults(results) {
  // Draw on small cam canvas
  const cw = camCanvas.width, ch = camCanvas.height;
  camCtx.clearRect(0,0,cw,ch);
  camCtx.drawImage(results.image, 0, 0, cw, ch);

  if (!results.multiHandLandmarks || results.multiHandLandmarks.length === 0) {
    handActive = false;
    handPtr.style.display = 'none';
    document.getElementById('cam-status').innerHTML = '<span class="dot" style="background:rgba(200,80,80,0.7)"></span>SEARCHING';
    return;
  }

  handActive = true;
  document.getElementById('cam-status').innerHTML = '<span class="dot"></span>TRACKING';

  const lm = results.multiHandLandmarks[0];

  // Draw skeleton on small cam
  camCtx.save();
  CONNECTIONS.forEach(([a,b]) => {
    camCtx.beginPath();
    // Note: cam canvas is CSS-flipped so we don't flip coords here
    camCtx.moveTo(lm[a].x * cw, lm[a].y * ch);
    camCtx.lineTo(lm[b].x * cw, lm[b].y * ch);
    camCtx.strokeStyle = 'rgba(140,210,255,0.55)';
    camCtx.lineWidth = 1.2;
    camCtx.stroke();
  });
  [4,8,12,16,20].forEach(i => {
    camCtx.beginPath();
    camCtx.arc(lm[i].x*cw, lm[i].y*ch, 3, 0, TAU);
    camCtx.fillStyle = 'rgba(200,240,255,0.9)';
    camCtx.fill();
  });
  camCtx.beginPath();
  camCtx.arc(lm[0].x*cw, lm[0].y*ch, 4, 0, TAU);
  camCtx.fillStyle = 'rgba(100,180,255,0.8)';
  camCtx.fill();
  camCtx.restore();

  // Map index tip to screen (mirror x because camera is front-facing)
  const ix = (1 - lm[8].x) * W;
  const iy = lm[8].y * H;

  // Update global pointer
  pointer.px = pointer.x; pointer.py = pointer.y;
  pointer.x  = ix; pointer.y = iy;
  pointer.vx = pointer.x - pointer.px;
  pointer.vy = pointer.y - pointer.py;
  pointer.speed = Math.sqrt(pointer.vx**2 + pointer.vy**2);

  // Full-screen hand pointer dot
  handPtr.style.display = 'block';
  handPtr.style.left = ix + 'px';
  handPtr.style.top  = iy + 'px';

  // Gesture
  const g = detectGesture(lm);
  document.getElementById('gval').textContent = g.toUpperCase();

  if (g === lastGesture) {
    gestureHold++;
  } else {
    gestureHold = 0;
    lastGesture = g;
  }

  if (gestureHold === 5 && g !== committedGesture) {
    committedGesture = g;

    // Pinch = grab nearest card
    if (g === 'pinch' || g === 'ok') {
      const c = nearestCard(ix, iy, 200);
      if (c) grabbedCard = c;
      pullMode = true;
      handPtr.style.width = handPtr.style.height = '8px';
      handPtr.style.borderColor = 'rgba(200,240,255,0.8)';
    } else {
      grabbedCard = null;
      pullMode = false;
      handPtr.style.width = handPtr.style.height = '16px';
      handPtr.style.borderColor = 'rgba(140,210,255,0.5)';

      // Open palm = scatter
      if (g === 'open' && committedGesture !== 'open') scatter();

      // Map gesture → arrangement
      if (GESTURE_ARR[g]) setArrangement(GESTURE_ARR[g]);
    }
  }

  // Release on non-pinch
  if (g !== 'pinch' && g !== 'ok') {
    grabbedCard = null;
    pullMode = false;
  }
}

// ─── Camera start ────────────────────────────────────────────────────────────

let mpCamera = null;

function startCamera() {
  const hands = new Hands({
    locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`
  });
  hands.setOptions({
    maxNumHands: 1,
    modelComplexity: 1,
    minDetectionConfidence: 0.72,
    minTrackingConfidence: 0.6,
  });
  hands.onResults(onHandResults);

  mpCamera = new Camera(videoEl, {
    onFrame: async () => {
      camCanvas.width  = videoEl.videoWidth  || 320;
      camCanvas.height = videoEl.videoHeight || 240;
      await hands.send({ image: videoEl });
    },
    width: 640, height: 480,
  });

  mpCamera.start().then(() => {
    document.getElementById('cam-wrap').style.opacity = '0.88';
    document.getElementById('perm-overlay').style.opacity = '0';
    setTimeout(() => document.getElementById('perm-overlay').style.display = 'none', 650);
  }).catch(() => {
    skipCamera();
  });
}

function skipCamera() {
  document.getElementById('perm-overlay').style.opacity = '0';
  setTimeout(() => document.getElementById('perm-overlay').style.display = 'none', 650);
}

document.getElementById('perm-btn').addEventListener('click', startCamera);
document.getElementById('skip-btn').addEventListener('click',  skipCamera);

// ─── Mouse fallback ───────────────────────────────────────────────────────────

window.addEventListener('mousemove', e => {
  if (handActive) return;
  pointer.px = pointer.x; pointer.py = pointer.y;
  pointer.x = e.clientX; pointer.y = e.clientY;
  pointer.vx = pointer.x - pointer.px; pointer.vy = pointer.y - pointer.py;
  pointer.speed = Math.sqrt(pointer.vx**2 + pointer.vy**2);
});
window.addEventListener('mousedown', () => { if (!handActive) pullMode = true; });
window.addEventListener('mouseup',   () => { if (!handActive) { pullMode = false; grabbedCard = null; } });
window.addEventListener('click', e => {
  if (!handActive && (e.target === document.body || e.target === stage)) scatter();
});
window.addEventListener('dblclick', () => {
  arrIdx = (arrIdx+1) % ARR_KEYS.length;
  setArrangement(ARR_KEYS[arrIdx]);
});
window.addEventListener('keydown', e => {
  const map = {'1':'drift','2':'grid','3':'fan','4':'stack','5':'spiral','6':'diagonal'};
  if (map[e.key]) setArrangement(map[e.key]);
  if (e.key===' ') { e.preventDefault(); scatter(); }
});
window.addEventListener('touchmove', e => {
  e.preventDefault();
  const t = e.touches[0];
  if (handActive) return;
  pointer.px = pointer.x; pointer.py = pointer.y;
  pointer.x = t.clientX; pointer.y = t.clientY;
  pointer.vx = pointer.x-pointer.px; pointer.vy = pointer.y-pointer.py;
  pointer.speed = Math.sqrt(pointer.vx**2+pointer.vy**2);
},{passive:false});
window.addEventListener('resize', () => {
  W=innerWidth; H=innerHeight; cx=W/2; cy=H/2;
});

// ─── Main loop ────────────────────────────────────────────────────────────────

function loop(ts) {
  requestAnimationFrame(loop);
  loopT = ts; frame++;
  tick(ts);
  moveCursor();
}

buildCards();
setArrangement('drift');
requestAnimationFrame(loop);
</script>
</body>
</html>
