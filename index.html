<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eudaimon — Art Cards</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
  background: #070707;
  overflow: hidden;
  font-family: 'Georgia', serif;
  cursor: none;
  user-select: none;
}

/* ── Custom cursor ── */
#cursor {
  position: fixed; width: 6px; height: 6px;
  background: rgba(255,255,255,0.85); border-radius: 50%;
  pointer-events: none; z-index: 9999;
  transform: translate(-50%,-50%);
  transition: transform 0.08s, background 0.3s;
}
#cursor-ring {
  position: fixed; width: 36px; height: 36px;
  border: 1px solid rgba(255,255,255,0.22); border-radius: 50%;
  pointer-events: none; z-index: 9998;
  transform: translate(-50%,-50%);
  transition: width 0.25s, height 0.25s, border-color 0.3s, transform 0.12s;
}

/* ── Cards ── */
.card {
  position: absolute;
  width: 158px; height: 218px;
  border-radius: 11px;
  border: 1px solid rgba(255,255,255,0.065);
  background: rgba(11,11,11,0.94);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 18px;
  pointer-events: all;
  will-change: transform;
  overflow: hidden;
  transition: border-color 0.4s;
}
.card::before {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(145deg, rgba(255,255,255,0.025) 0%, transparent 60%);
  border-radius: inherit; pointer-events: none;
}
.card.hovered { border-color: rgba(255,255,255,0.14); }
.card.active  { border-color: rgba(255,255,255,0.28); }

.card-label {
  font-size: 8px; letter-spacing: 0.26em;
  color: rgba(255,255,255,0.18); text-transform: uppercase;
  font-family: 'Courier New', monospace; position: absolute;
  bottom: 18px; left: 0; right: 0; text-align: center;
}
.card-index {
  font-size: 7px; letter-spacing: 0.15em;
  color: rgba(255,255,255,0.08); font-family: 'Courier New', monospace;
  position: absolute; top: 14px; left: 16px;
}

/* ── Color field cards ── */
.card-field {
  position: absolute; inset: 0; border-radius: inherit;
  opacity: 0.82;
}

/* ── Text cards ── */
.card-text {
  color: rgba(255,255,255,0.75); font-size: 12px;
  line-height: 1.65; text-align: center; padding: 0 20px;
  letter-spacing: 0.04em;
}
.card-text.serif { font-family: 'Georgia', serif; font-style: italic; }
.card-text.mono  { font-family: 'Courier New', monospace; font-size: 10px; letter-spacing: 0.1em; }

/* ── Symbol cards ── */
.card-symbol {
  font-size: 42px; color: rgba(255,255,255,0.65);
  line-height: 1; font-family: 'Georgia', serif;
}

/* ── Gesture hint ── */
#hint {
  position: fixed; bottom: 32px; left: 50%;
  transform: translateX(-50%);
  font-family: 'Courier New', monospace; font-size: 9px;
  letter-spacing: 0.18em; color: rgba(255,255,255,0.18);
  text-align: center; pointer-events: none;
  transition: opacity 0.6s;
}
#hint span { margin: 0 12px; }

/* ── Mode indicator ── */
#mode-indicator {
  position: fixed; top: 28px; right: 28px;
  font-family: 'Courier New', monospace; font-size: 9px;
  letter-spacing: 0.22em; color: rgba(255,255,255,0.2);
  text-align: right; pointer-events: none;
}
#mode-indicator .mode-val { color: rgba(255,255,255,0.5); }

/* ── Wordmark ── */
#wordmark {
  position: fixed; top: 28px; left: 28px;
  pointer-events: none;
}
#wordmark h1 {
  font-size: 11px; font-weight: 400; letter-spacing: 0.32em;
  color: rgba(255,255,255,0.35); font-family: 'Courier New', monospace;
  text-transform: uppercase;
}
#wordmark p {
  font-size: 8px; letter-spacing: 0.18em;
  color: rgba(255,255,255,0.1); margin-top: 4px;
  font-family: 'Courier New', monospace;
}
</style>
</head>
<body>

<div id="cursor"></div>
<div id="cursor-ring"></div>

<div id="wordmark">
  <h1>Eudaimon</h1>
  <p>Visual System · 2026</p>
</div>

<div id="mode-indicator">
  ARRANGEMENT &nbsp;<span class="mode-val" id="modeVal">DRIFT</span>
</div>

<div id="hint">
  <span>MOVE — cards follow</span>
  <span>CLICK — scatter</span>
  <span>HOLD — pull</span>
</div>

<div id="stage"></div>

<script>
// ─── Setup ───────────────────────────────────────────────────────────────────

const stage = document.getElementById('stage');
const cursor = document.getElementById('cursor');
const ring   = document.getElementById('cursor-ring');
const TAU    = Math.PI * 2;

let W = window.innerWidth, H = window.innerHeight;
let cx = W/2, cy = H/2;

const mouse  = { x: cx, y: cy, px: cx, py: cy, vx:0, vy:0, speed:0, down:false };
let frame = 0, t = 0;
let scatterT = 0;   // 0..1 scatter impulse
let pullMode = false;
let currentArrangement = 'drift';

// ─── Card definitions ────────────────────────────────────────────────────────

const CARD_DEFS = [
  // Sacred geometry SVGs
  {
    type: 'svg', label: 'Vesica Piscis',
    svg: `<svg viewBox="-70 -50 140 100" width="88" height="62" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="0.8">
      <circle cx="-18" cy="0" r="36"/>
      <circle cx="18"  cy="0" r="36"/>
    </svg>`
  },
  {
    type: 'svg', label: 'Flower of Life',
    svg: `<svg viewBox="-70 -70 140 140" width="88" height="88" fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="0.7">
      <circle cx="0"   cy="0"   r="22"/>
      <circle cx="0"   cy="-22" r="22"/>
      <circle cx="0"   cy="22"  r="22"/>
      <circle cx="19"  cy="-11" r="22"/>
      <circle cx="19"  cy="11"  r="22"/>
      <circle cx="-19" cy="-11" r="22"/>
      <circle cx="-19" cy="11"  r="22"/>
      <circle cx="0"   cy="0"   r="44" opacity="0.3"/>
    </svg>`
  },
  {
    type: 'svg', label: "Metatron's Cube",
    svg: `<svg viewBox="-70 -70 140 140" width="88" height="88" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="0.65">
      ${[0,1,2,3,4,5].map(i=>{const a=i*TAU/6;return`<circle cx="${(Math.cos(a)*34).toFixed(1)}" cy="${(Math.sin(a)*34).toFixed(1)}" r="34"/>`}).join('')}
      <circle cx="0" cy="0" r="34"/>
      <polygon points="${[0,1,2,3,4,5].map(i=>{const a=i*TAU/6;return`${(Math.cos(a)*34).toFixed(1)},${(Math.sin(a)*34).toFixed(1)}`}).join(' ')}" stroke-width="0.5"/>
      <polygon points="${[0,1,2,3,4,5].map(i=>{const a=i*TAU/6+TAU/12;return`${(Math.cos(a)*34).toFixed(1)},${(Math.sin(a)*34).toFixed(1)}`}).join(' ')}" stroke-width="0.5"/>
    </svg>`
  },
  {
    type: 'svg', label: 'Sri Yantra',
    svg: `<svg viewBox="-60 -60 120 120" width="88" height="88" fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="0.75">
      ${[38,28,20,13].map((r,i)=>`<polygon points="${[0,1,2].map(k=>{const a=(i%2===0?-TAU/12:TAU/12)+k*TAU/3;return`${(Math.cos(a)*r).toFixed(1)},${(Math.sin(a)*r).toFixed(1)}`}).join(' ')}"/>`).join('')}
      <circle cx="0" cy="0" r="3" fill="rgba(255,255,255,0.3)" stroke="none"/>
      <circle cx="0" cy="0" r="52" stroke-width="0.4" opacity="0.3"/>
    </svg>`
  },
  {
    type: 'svg', label: 'Golden Ratio',
    svg: `<svg viewBox="-55 -55 110 110" width="88" height="88" fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="0.7">
      <rect x="-50" y="-31" width="50" height="50" rx="0.5"/>
      <rect x="0"   y="-31" width="31" height="31" rx="0.5"/>
      <rect x="0"   y="0"   width="31" height="19" rx="0.5"/>
      <rect x="0"   y="19"  width="19" height="12" rx="0.5"/>
      <path d="M -50,-31 Q -50,19 0,19" stroke-width="0.9" opacity="0.8"/>
    </svg>`
  },
  {
    type: 'svg', label: 'Torus',
    svg: `<svg viewBox="-60 -60 120 120" width="88" height="88" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="0.7">
      <ellipse cx="0" cy="0" rx="52" ry="28"/>
      <ellipse cx="0" cy="0" rx="52" ry="52" opacity="0.25"/>
      <ellipse cx="0" cy="0" rx="20" ry="28"/>
      <ellipse cx="0" cy="-14" rx="32" ry="14" opacity="0.5"/>
      <ellipse cx="0" cy="14"  rx="32" ry="14" opacity="0.5"/>
    </svg>`
  },
  {
    type: 'svg', label: 'Fibonacci',
    svg: `<svg viewBox="-55 -55 110 110" width="88" height="88" fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="0.75">
      <path d="M 0,0 A 8,8 0 0,1 8,0 A 13,13 0 0,0 8,-13 A 21,21 0 0,1 -13,-13 A 34,34 0 0,0 -13,21 A 55,55 0 0,1 42,21"/>
      <circle cx="0" cy="0" r="1.5" fill="rgba(255,255,255,0.4)" stroke="none"/>
    </svg>`
  },
  {
    type: 'svg', label: 'Eye',
    svg: `<svg viewBox="-60 -40 120 80" width="88" height="60" fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="0.75">
      <path d="M -52,0 Q 0,-34 52,0 Q 0,34 -52,0 Z"/>
      <circle cx="0" cy="0" r="16"/>
      <circle cx="0" cy="0" r="6" fill="rgba(255,255,255,0.25)" stroke="none"/>
      <circle cx="4" cy="-4" r="2.5" fill="rgba(255,255,255,0.5)" stroke="none"/>
    </svg>`
  },

  // Text / concept cards
  {
    type: 'text', label: 'Thesis', serif: true,
    text: '"The money is made owning bottlenecks, not end products."'
  },
  {
    type: 'text', label: 'Doctrine', mono: true,
    text: 'OWN THE\nCHOKEPOINT\nNOT THE\nPRODUCT'
  },
  {
    type: 'text', label: 'State', mono: true,
    text: 'CONSCIOUSNESS\nLEVEL 32.25\n\nCOSMIC\nTRANSCENDENCE'
  },

  // Symbol cards
  { type: 'symbol', label: 'Infinity',  symbol: '∞' },
  { type: 'symbol', label: 'Delta',     symbol: 'Δ' },
  { type: 'symbol', label: 'Omega',     symbol: 'Ω' },

  // Color field cards
  { type: 'field', label: 'Deep Space', gradient: 'linear-gradient(160deg, #0a1628 0%, #0d2441 50%, #071220 100%)' },
  { type: 'field', label: 'Amber',      gradient: 'linear-gradient(150deg, #1a0e00 0%, #2a1a00 50%, #0f0800 100%)' },
  { type: 'field', label: 'Void',       gradient: 'linear-gradient(135deg, #08080e 0%, #0e0e1a 60%, #060610 100%)' },
];

// ─── Card instances ──────────────────────────────────────────────────────────

const cards = [];

function buildCards() {
  CARD_DEFS.forEach((def, i) => {
    const el = document.createElement('div');
    el.className = 'card';

    // Index label
    const idx = document.createElement('div');
    idx.className = 'card-index';
    idx.textContent = String(i+1).padStart(2,'0');
    el.appendChild(idx);

    // Content
    if (def.type === 'svg') {
      el.innerHTML += def.svg;
    } else if (def.type === 'text') {
      const t = document.createElement('div');
      t.className = 'card-text' + (def.serif?' serif':'') + (def.mono?' mono':'');
      t.innerHTML = def.text.replace(/\n/g,'<br>');
      el.appendChild(t);
    } else if (def.type === 'symbol') {
      const s = document.createElement('div');
      s.className = 'card-symbol';
      s.textContent = def.symbol;
      el.appendChild(s);
    } else if (def.type === 'field') {
      const f = document.createElement('div');
      f.className = 'card-field';
      f.style.background = def.gradient;
      el.appendChild(f);
    }

    // Label
    const lbl = document.createElement('div');
    lbl.className = 'card-label';
    lbl.textContent = def.label.toUpperCase();
    el.appendChild(lbl);

    el.addEventListener('click', () => onCardClick(card));

    stage.appendChild(el);

    // Physics state
    const angle = (i / CARD_DEFS.length) * TAU;
    const r     = Math.min(W, H) * 0.28;
    const card  = {
      el, def, i,
      x: cx + Math.cos(angle)*r, y: cy + Math.sin(angle)*r,
      hx: cx + Math.cos(angle)*r, hy: cy + Math.sin(angle)*r,
      vx: 0, vy: 0,
      rotX: 0, rotY: 0, rotZ: 0,
      scale: 1,
      depth: 0.8 + Math.random() * 0.4,
      phase: Math.random() * TAU,
      floatAmp: 4 + Math.random() * 6,
      floatFreq: 0.003 + Math.random() * 0.004,
      active: false,
      flipped: false,
    };
    cards.push(card);
  });
}

// ─── Arrangements ────────────────────────────────────────────────────────────

const arrangements = {
  drift(cards) {
    cards.forEach((c, i) => {
      const a = (i / cards.length) * TAU + t * 0.00015;
      const r = Math.min(W,H) * 0.27;
      c.hx = cx + Math.cos(a)*r;
      c.hy = cy + Math.sin(a)*r;
    });
  },
  grid(cards) {
    const cols = Math.ceil(Math.sqrt(cards.length));
    const rows = Math.ceil(cards.length / cols);
    const pw   = 180, ph = 250;
    const offX = -(cols-1)*pw/2, offY = -(rows-1)*ph/2;
    cards.forEach((c,i) => {
      c.hx = cx + offX + (i % cols) * pw;
      c.hy = cy + offY + Math.floor(i/cols) * ph;
    });
  },
  fan(cards) {
    const total = cards.length;
    const fanW  = Math.min(W*0.85, total*52);
    cards.forEach((c,i) => {
      const pct  = total > 1 ? i/(total-1) : 0.5;
      const x    = cx - fanW/2 + pct*fanW;
      const arc  = Math.sin(pct*Math.PI) * -H*0.18;
      const rz   = (pct-0.5) * 32;
      c.hx = x; c.hy = cy*1.1 + arc;
      c.rotZ = rz;
    });
  },
  stack(cards) {
    cards.forEach((c,i) => {
      c.hx = cx + (i-cards.length/2)*2.5;
      c.hy = cy + (i-cards.length/2)*1.5;
      c.rotZ = (i - cards.length/2) * 4;
    });
  },
  spiral(cards) {
    cards.forEach((c,i) => {
      const a = i * 0.72 * TAU;
      const r = 22 + i * 18;
      c.hx = cx + Math.cos(a)*r;
      c.hy = cy + Math.sin(a)*r;
    });
  },
  diagonal(cards) {
    const total = cards.length;
    cards.forEach((c,i) => {
      const pct = i/(total-1);
      c.hx = W*0.12 + pct*(W*0.76);
      c.hy = H*0.15 + pct*(H*0.70);
      c.rotZ = -8 + pct*16;
    });
  },
};

const arrangementKeys = Object.keys(arrangements);
let arrangementIdx = 0;

function setArrangement(name) {
  currentArrangement = name;
  document.getElementById('modeVal').textContent = name.toUpperCase();
  // Clear rotZ from fan/stack/diagonal if switching away
  if (name === 'grid' || name === 'drift' || name === 'spiral') {
    cards.forEach(c => { c.rotZ = 0; });
  }
}

// ─── Card interaction ────────────────────────────────────────────────────────

function onCardClick(card) {
  card.flipped = !card.flipped;
  card.active  = card.flipped;
  card.el.classList.toggle('active', card.active);
  scatterT = 0.5;
}

function scatter() {
  scatterT = 1.0;
  cards.forEach(c => {
    const angle = Math.atan2(c.y - mouse.y, c.x - mouse.x);
    const force = 8 + Math.random() * 10;
    c.vx += Math.cos(angle) * force;
    c.vy += Math.sin(angle) * force;
  });
}

// ─── Physics tick ────────────────────────────────────────────────────────────

const K  = 0.055;  // spring stiffness
const DMP = 0.78;  // damping

function tick() {
  const mx = mouse.x, my = mouse.y;
  const mspeed = mouse.speed;

  arrangements[currentArrangement](cards);

  cards.forEach((c, i) => {
    // Spring toward home
    const dx = c.hx - c.x;
    const dy = c.hy - c.y;
    const k  = K * (0.7 + 0.6 * c.depth);
    c.vx = (c.vx + dx * k) * DMP;
    c.vy = (c.vy + dy * k) * DMP;

    // Mouse influence
    const mdx  = mx - c.x, mdy = my - c.y;
    const mdist = Math.sqrt(mdx*mdx + mdy*mdy);
    const mInfl = Math.max(0, 1 - mdist/240);

    if (pullMode && mInfl > 0.1) {
      // Pull cards toward mouse when holding
      c.vx += mdx * 0.04 * mInfl;
      c.vy += mdy * 0.04 * mInfl;
    } else if (mspeed > 4 && mInfl > 0.05) {
      // Repel on fast movement
      const ang = Math.atan2(mdy, mdx);
      const push = mspeed * 0.25 * mInfl;
      c.vx -= Math.cos(ang) * push;
      c.vy -= Math.sin(ang) * push;
    }

    // Ambient float
    const floatX = Math.cos(t * c.floatFreq + c.phase) * c.floatAmp * 0.4;
    const floatY = Math.sin(t * c.floatFreq * 1.3 + c.phase) * c.floatAmp;

    c.x += c.vx;
    c.y += c.vy;

    // 3D tilt toward mouse
    const tiltStrength = Math.min(mInfl * 18, 12);
    const targetRX = -((mdy / (H/2)) * tiltStrength);
    const targetRY =  ((mdx / (W/2)) * tiltStrength);
    c.rotX = c.rotX * 0.88 + targetRX * 0.12;
    c.rotY = c.rotY * 0.88 + targetRY * 0.12;

    // Scale slightly on hover proximity
    const targetScale = 1 + mInfl * 0.06;
    c.scale = c.scale * 0.92 + targetScale * 0.08;

    // Hover class
    c.el.classList.toggle('hovered', mInfl > 0.55);

    // Apply transform
    const fx = c.x + floatX;
    const fy = c.y + floatY;
    c.el.style.transform =
      `translate(calc(${fx}px - 50%), calc(${fy}px - 50%))
       rotateX(${c.rotX.toFixed(2)}deg)
       rotateY(${c.rotY.toFixed(2)}deg)
       rotateZ(${(c.rotZ).toFixed(2)}deg)
       scale(${c.scale.toFixed(4)})`;

    // Depth-based opacity
    c.el.style.opacity = (0.55 + c.depth * 0.45).toFixed(2);
    c.el.style.zIndex  = Math.round(c.depth * 10 + (pullMode && mInfl > 0.3 ? 20 : 0));
  });
}

// ─── Cursor ──────────────────────────────────────────────────────────────────

let cursorX = 0, cursorY = 0, ringX = 0, ringY = 0;

function moveCursor() {
  cursorX += (mouse.x - cursorX) * 0.9;
  cursorY += (mouse.y - cursorY) * 0.9;
  ringX   += (mouse.x - ringX)   * 0.18;
  ringY   += (mouse.y - ringY)   * 0.18;
  cursor.style.left = cursorX + 'px';
  cursor.style.top  = cursorY + 'px';
  ring.style.left   = ringX + 'px';
  ring.style.top    = ringY + 'px';

  if (pullMode) {
    ring.style.width  = ring.style.height = '64px';
    ring.style.borderColor = 'rgba(255,255,255,0.35)';
  } else if (mouse.speed > 5) {
    ring.style.width  = ring.style.height = '20px';
    ring.style.borderColor = 'rgba(255,255,255,0.15)';
  } else {
    ring.style.width  = ring.style.height = '36px';
    ring.style.borderColor = 'rgba(255,255,255,0.22)';
  }
}

// ─── Main loop ───────────────────────────────────────────────────────────────

function loop(ts) {
  requestAnimationFrame(loop);
  t = ts;
  frame++;
  scatterT = Math.max(0, scatterT - 0.02);
  tick();
  moveCursor();
}

// ─── Input ───────────────────────────────────────────────────────────────────

window.addEventListener('mousemove', e => {
  mouse.px = mouse.x; mouse.py = mouse.y;
  mouse.x = e.clientX; mouse.y = e.clientY;
  mouse.vx = mouse.x - mouse.px;
  mouse.vy = mouse.y - mouse.py;
  mouse.speed = Math.sqrt(mouse.vx*mouse.vx + mouse.vy*mouse.vy);
});

window.addEventListener('mousedown', () => { pullMode = true; });
window.addEventListener('mouseup',   () => { pullMode = false; });

window.addEventListener('click', e => {
  if (e.target === document.body || e.target === stage) {
    scatter();
  }
});

window.addEventListener('dblclick', () => {
  arrangementIdx = (arrangementIdx + 1) % arrangementKeys.length;
  setArrangement(arrangementKeys[arrangementIdx]);
});

// Touch
window.addEventListener('touchmove', e => {
  e.preventDefault();
  const touch = e.touches[0];
  mouse.px = mouse.x; mouse.py = mouse.y;
  mouse.x  = touch.clientX; mouse.y = touch.clientY;
  mouse.vx = mouse.x - mouse.px; mouse.vy = mouse.y - mouse.py;
  mouse.speed = Math.sqrt(mouse.vx*mouse.vx + mouse.vy*mouse.vy);
}, {passive:false});

window.addEventListener('touchstart', e => {
  const touch = e.touches[0];
  mouse.x = touch.clientX; mouse.y = touch.clientY;
  if (e.touches.length === 2) {
    arrangementIdx = (arrangementIdx + 1) % arrangementKeys.length;
    setArrangement(arrangementKeys[arrangementIdx]);
  }
});

// Keyboard shortcuts
window.addEventListener('keydown', e => {
  const map = {
    '1':'drift','2':'grid','3':'fan',
    '4':'stack','5':'spiral','6':'diagonal',
  };
  if (map[e.key]) setArrangement(map[e.key]);
  if (e.key === ' ') { e.preventDefault(); scatter(); }
});

window.addEventListener('resize', () => {
  W = window.innerWidth; H = window.innerHeight;
  cx = W/2; cy = H/2;
});

// Fade hint out
setTimeout(() => {
  document.getElementById('hint').style.opacity = '0';
}, 5000);

// ─── Init ────────────────────────────────────────────────────────────────────

buildCards();
setArrangement('drift');
requestAnimationFrame(loop);
</script>
</body>
</html>
