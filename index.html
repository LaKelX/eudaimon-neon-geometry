<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eudaimon — Garden Cards</title>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#3d5c28; overflow:hidden; font-family:'Georgia',serif; cursor:none; user-select:none; }

#bg { position:fixed; inset:0; z-index:0; }
#stage { position:fixed; inset:0; z-index:10; }

/* ── Glass cards ── */
.card {
  position:absolute; width:120px; height:168px;
  border-radius:12px;
  background:rgba(255,252,240,0.062);
  backdrop-filter:blur(24px) saturate(200%) brightness(1.06);
  -webkit-backdrop-filter:blur(24px) saturate(200%) brightness(1.06);
  border:0.7px solid rgba(255,255,255,0.17);
  box-shadow:
    0 6px 28px rgba(0,0,0,0.16),
    inset 0 1px 0 rgba(255,255,255,0.20),
    inset 0 -1px 0 rgba(0,0,0,0.06);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  pointer-events:all; will-change:transform; overflow:hidden;
  transition:border-color .4s, box-shadow .45s;
}
.card::before {
  content:''; position:absolute; top:0; left:14px; right:14px; height:0.7px;
  background:linear-gradient(90deg, transparent, rgba(255,255,255,0.22), transparent);
  pointer-events:none;
}
.card.divine  { border-color:rgba(255,218,110,0.26); background:rgba(255,248,215,0.07); }
.card.divine::before { background:linear-gradient(90deg, transparent, rgba(255,210,80,0.44), transparent); }
.card.forest  { border-color:rgba(125,215,115,0.24); background:rgba(215,255,215,0.06); }
.card.forest::before { background:linear-gradient(90deg, transparent, rgba(105,210,95,0.38), transparent); }
.card.garden  { border-color:rgba(255,192,172,0.24); background:rgba(255,238,228,0.07); }
.card.garden::before { background:linear-gradient(90deg, transparent, rgba(255,170,148,0.38), transparent); }

.card.hovered {
  box-shadow:0 10px 38px rgba(0,0,0,0.20), inset 0 1px 0 rgba(255,255,255,0.26) !important;
}
.card.divine.hovered  {
  border-color:rgba(255,208,60,0.52) !important;
  box-shadow:0 12px 44px rgba(195,150,0,0.18), inset 0 1px 0 rgba(255,255,185,0.28) !important;
}
.card.forest.hovered  {
  border-color:rgba(105,218,95,0.50) !important;
  box-shadow:0 12px 44px rgba(45,155,45,0.15), inset 0 1px 0 rgba(185,255,185,0.22) !important;
}
.card.garden.hovered  {
  border-color:rgba(255,170,148,0.50) !important;
  box-shadow:0 12px 44px rgba(195,90,70,0.15), inset 0 1px 0 rgba(255,210,200,0.22) !important;
}
.card.grabbed {
  border-color:rgba(170,222,255,0.54) !important;
  box-shadow:0 16px 52px rgba(85,172,255,0.20) !important;
}

/* Art fills the card, content overlays */
.card-art { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }
.card-content {
  position:relative; z-index:2;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:7px;
  width:100%; padding:0 11px;
}
.card-label {
  position:absolute; bottom:10px; left:0; right:0; text-align:center;
  font-family:'Courier New',monospace; font-size:5.8px; letter-spacing:.26em;
  color:rgba(255,255,255,0.30); text-transform:uppercase; z-index:3;
  text-shadow:0 1px 3px rgba(0,0,0,0.4);
}
.card-index {
  position:absolute; top:9px; left:10px; z-index:3;
  font-family:'Courier New',monospace; font-size:5.8px; letter-spacing:.10em;
  color:rgba(255,255,255,0.15);
}
.card-tag {
  position:absolute; top:9px; right:10px; z-index:3;
  font-family:'Courier New',monospace; font-size:5.2px; letter-spacing:.12em;
  color:rgba(255,255,255,0.12);
}
.card-text {
  color:rgba(255,255,255,0.80); font-size:9px; line-height:1.62;
  text-align:center; letter-spacing:.03em;
  text-shadow:0 1px 5px rgba(0,0,0,0.5);
}
.card-text.serif { font-style:italic; font-size:8.5px; }
.card-text.mono  { font-family:'Courier New',monospace; font-size:7px; letter-spacing:.09em; }
.card-symbol { font-size:32px; color:rgba(255,255,255,0.70); line-height:1; text-shadow:0 2px 10px rgba(0,0,0,0.4); }

/* ── Pip cam ── */
#cam-wrap { position:fixed; bottom:22px; right:22px; width:186px; height:140px; border-radius:12px; overflow:hidden; border:1px solid rgba(255,255,255,0.18); z-index:200; backdrop-filter:blur(4px); }
#cam-video  { position:absolute; width:100%; height:100%; object-fit:cover; transform:scaleX(-1); opacity:0.55; }
#cam-canvas { position:absolute; width:100%; height:100%; transform:scaleX(-1); }
#cam-label  { position:absolute; bottom:7px; left:9px; font-family:'Courier New',monospace; font-size:7px; letter-spacing:.14em; color:rgba(255,255,255,0.45); }

/* ── Hand pointer ── */
#hand-ptr {
  position:fixed; pointer-events:none; z-index:150;
  width:9px; height:9px; border-radius:50%;
  background:rgba(255,255,255,0.82);
  box-shadow:0 0 0 5px rgba(255,255,255,0.10), 0 0 18px rgba(255,255,255,0.32);
  transform:translate(-50%,-50%); display:none;
  transition:background .18s, box-shadow .18s;
}
#hand-ptr.grabbing {
  background:rgba(165,225,255,0.92);
  box-shadow:0 0 0 7px rgba(140,205,255,0.14), 0 0 22px rgba(140,205,255,0.42);
}

/* ── UI ── */
#wordmark { position:fixed; top:24px; left:24px; pointer-events:none; z-index:100; }
#wordmark h1 { font-size:10px; font-weight:400; letter-spacing:.34em; color:rgba(255,255,255,0.55); font-family:'Courier New',monospace; text-shadow:0 1px 6px rgba(0,0,0,0.3); }
#wordmark p  { font-size:7px; letter-spacing:.2em; color:rgba(255,255,255,0.25); margin-top:4px; font-family:'Courier New',monospace; }

#hud { position:fixed; top:24px; right:24px; text-align:right; pointer-events:none; z-index:100; font-family:'Courier New',monospace; font-size:7.5px; letter-spacing:.16em; line-height:2.1; color:rgba(255,255,255,0.25); text-shadow:0 1px 4px rgba(0,0,0,0.3); }
#hud .v { color:rgba(255,255,255,0.6); }

#touch-flash { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); font-family:'Courier New',monospace; font-size:9px; letter-spacing:.24em; color:rgba(255,255,255,0); pointer-events:none; z-index:300; text-shadow:0 2px 8px rgba(0,0,0,0.4); transition:color .12s,opacity .5s; }

/* ── Permission ── */
#perm { position:fixed; inset:0; background:rgba(30,48,18,0.9); backdrop-filter:blur(12px); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; z-index:1000; transition:opacity .5s; }
#perm h2 { font-family:'Courier New',monospace; font-size:10px; letter-spacing:.34em; color:rgba(255,255,255,0.6); font-weight:400; }
#perm p  { font-family:'Courier New',monospace; font-size:8px; letter-spacing:.18em; color:rgba(255,255,255,0.28); }
.perm-btn { background:none; border:1px solid rgba(255,255,255,0.2); color:rgba(255,255,255,0.5); font-family:'Courier New',monospace; font-size:8px; letter-spacing:.2em; padding:10px 26px; border-radius:4px; cursor:pointer; transition:all .25s; }
.perm-btn:hover { border-color:rgba(180,230,140,0.5); color:rgba(200,255,180,0.8); }
.perm-skip { background:none; border:none; cursor:pointer; font-family:'Courier New',monospace; font-size:7px; letter-spacing:.14em; color:rgba(255,255,255,0.18); }
.perm-skip:hover { color:rgba(255,255,255,0.38); }
</style>
</head>
<body>

<div id="perm">
  <h2>EUDAIMON</h2>
  <p>Enable camera for hand tracking</p>
  <button class="perm-btn" id="perm-btn">ENABLE CAMERA</button>
  <button class="perm-skip" id="skip-btn">Enter without camera</button>
</div>

<canvas id="bg"></canvas>
<div id="hand-ptr"></div>
<div id="touch-flash"></div>

<div id="wordmark"><h1>Eudaimon</h1><p>Garden · 2026</p></div>
<div id="hud">
  GESTURE &nbsp;<span class="v" id="hud-g">—</span><br>
  TOUCH &nbsp;&nbsp;&nbsp;<span class="v" id="hud-t">—</span><br>
  LAYOUT &nbsp;&nbsp;<span class="v" id="hud-l">DRIFT</span>
</div>

<div id="cam-wrap" style="opacity:0">
  <video id="cam-video" autoplay muted playsinline></video>
  <canvas id="cam-canvas"></canvas>
  <div id="cam-label">○ SEARCHING</div>
</div>

<div id="stage"></div>
<canvas id="intro" style="position:fixed;inset:0;z-index:600;pointer-events:none;"></canvas>

<script>
const TAU = Math.PI * 2;
let W = innerWidth, H = innerHeight, cx = W/2, cy = H/2;

// ─── Garden background ────────────────────────────────────────────────────────

const bgCv  = document.getElementById('bg');
const bgCtx = bgCv.getContext('2d');

const BOKEH = Array.from({length:28}, () => ({
  x: Math.random(), y: Math.random(),
  r: 24 + Math.random() * 70,
  a: 0.025 + Math.random() * 0.065,
  spd: 0.00003 + Math.random() * 0.00009,
  ph: Math.random() * TAU,
  hue: Math.random() < 0.5 ? 50 + Math.random()*30 : 100 + Math.random()*40,
}));

const PETALS = Array.from({length:22}, () => ({
  x: Math.random() * 1,
  y: Math.random() * 1,
  vx: (-0.4 + Math.random() * 0.8) * 0.0003,
  vy: (0.15 + Math.random() * 0.5) * 0.0003,
  rot: Math.random() * TAU,
  rs: (Math.random() - 0.5) * 0.04,
  w: 0.005 + Math.random() * 0.01,
  h: 0.002 + Math.random() * 0.006,
  a: 0.35 + Math.random() * 0.45,
  hue: Math.random() < 0.6 ? 340 + Math.random()*25 : 30 + Math.random()*20,
}));

// Distant tree silhouettes (static positions)
const TREES = Array.from({length:14}, (_, i) => ({
  x: (i / 14) + (Math.random() * 0.06 - 0.03),
  h: 0.12 + Math.random() * 0.10,
  w: 0.018 + Math.random() * 0.022,
}));

function drawGarden(t) {
  bgCtx.clearRect(0, 0, W, H);

  // Sky gradient
  const sky = bgCtx.createLinearGradient(0, 0, 0, H * 0.52);
  sky.addColorStop(0,    '#f2d98a');
  sky.addColorStop(0.25, '#ddc878');
  sky.addColorStop(0.6,  '#b8cf8a');
  sky.addColorStop(1,    '#7aaa62');
  bgCtx.fillStyle = sky; bgCtx.fillRect(0, 0, W, H * 0.52);

  // Sun glow
  const sunX = W * 0.68, sunY = H * 0.11;
  const sg = bgCtx.createRadialGradient(sunX, sunY, 0, sunX, sunY, H * 0.38);
  sg.addColorStop(0,   'rgba(255,240,170,0.80)');
  sg.addColorStop(0.22,'rgba(255,215,105,0.32)');
  sg.addColorStop(1,   'rgba(255,190,60,0)');
  bgCtx.fillStyle = sg; bgCtx.fillRect(0, 0, W, H);

  // Sun rays — thin golden wedges radiating outward
  bgCtx.save();
  for (let r = 0; r < 14; r++) {
    const a = (r / 14) * TAU + Math.sin(t * 0.00012 + r * 0.9) * 0.018;
    const len = W * 0.62, spread = 0.016 + (r % 3 === 0 ? 0.012 : 0);
    const op  = r % 3 === 0 ? 0.058 : r % 3 === 1 ? 0.034 : 0.020;
    const rg  = bgCtx.createLinearGradient(sunX, sunY, sunX+Math.cos(a)*len, sunY+Math.sin(a)*len);
    rg.addColorStop(0,    `rgba(255,244,190,${op*2.6})`);
    rg.addColorStop(0.18, `rgba(255,238,170,${op*1.4})`);
    rg.addColorStop(1,    'rgba(255,225,140,0)');
    bgCtx.beginPath();
    bgCtx.moveTo(sunX, sunY);
    bgCtx.lineTo(sunX+Math.cos(a-spread)*len, sunY+Math.sin(a-spread)*len);
    bgCtx.lineTo(sunX+Math.cos(a+spread)*len, sunY+Math.sin(a+spread)*len);
    bgCtx.closePath();
    bgCtx.fillStyle = rg; bgCtx.fill();
  }
  bgCtx.restore();

  // Ground
  const gnd = bgCtx.createLinearGradient(0, H * 0.48, 0, H);
  gnd.addColorStop(0,   '#5c9044');
  gnd.addColorStop(0.2, '#4a7835');
  gnd.addColorStop(0.55,'#386028');
  gnd.addColorStop(1,   '#24401a');
  bgCtx.fillStyle = gnd; bgCtx.fillRect(0, H * 0.48, W, H * 0.52);

  // Horizon mist
  const mist = bgCtx.createLinearGradient(0, H * 0.43, 0, H * 0.56);
  mist.addColorStop(0,   'rgba(218,232,200,0)');
  mist.addColorStop(0.45,'rgba(224,236,210,0.42)');
  mist.addColorStop(1,   'rgba(200,220,195,0)');
  bgCtx.fillStyle = mist; bgCtx.fillRect(0, H * 0.43, W, H * 0.13);

  // Distant trees
  TREES.forEach(tr => {
    const tx = tr.x * W;
    const ty = H * 0.48;
    const tw = tr.w * W;
    const th = tr.h * H;
    bgCtx.beginPath();
    bgCtx.moveTo(tx, ty);
    bgCtx.lineTo(tx - tw * 0.5, ty - th * 0.55);
    bgCtx.quadraticCurveTo(tx, ty - th, tx + tw * 0.5, ty - th * 0.55);
    bgCtx.closePath();
    bgCtx.fillStyle = 'rgba(26,52,18,0.55)';
    bgCtx.fill();
    bgCtx.fillStyle = 'rgba(26,52,18,0.35)';
    bgCtx.fillRect(tx - tw * 0.12, ty - th * 0.55, tw * 0.24, th * 0.55);
  });

  // Bokeh orbs (light through leaves)
  BOKEH.forEach(b => {
    const bx = (b.x + Math.sin(t * b.spd + b.ph) * 0.04) * W;
    const by = (b.y + Math.cos(t * b.spd * 0.7 + b.ph) * 0.025) * H;
    const gr = bgCtx.createRadialGradient(bx, by, 0, bx, by, b.r);
    gr.addColorStop(0,   `hsla(${b.hue},65%,84%,${b.a})`);
    gr.addColorStop(1,   `hsla(${b.hue},55%,74%,0)`);
    bgCtx.fillStyle = gr;
    bgCtx.beginPath(); bgCtx.arc(bx, by, b.r, 0, TAU); bgCtx.fill();
  });

  // Floating petals
  PETALS.forEach(p => {
    p.x = (p.x + p.vx + 1) % 1;
    p.y = (p.y + p.vy + 1) % 1;
    p.rot += p.rs;
    bgCtx.save();
    bgCtx.translate(p.x * W, p.y * H);
    bgCtx.rotate(p.rot);
    bgCtx.beginPath();
    bgCtx.ellipse(0, 0, p.w * W, p.h * W, 0, 0, TAU);
    bgCtx.fillStyle = `hsla(${p.hue},55%,84%,${p.a})`;
    bgCtx.fill();
    bgCtx.restore();
  });

  // Grass blades at bottom
  for (let i = 0; i < 80; i++) {
    const gx = (i / 80) * W + Math.sin(i * 1.7) * 18;
    const gy = H * 0.5 + (i % 3) * 4;
    const gh = 18 + Math.sin(i * 2.3 + t * 0.0008) * 8;
    bgCtx.beginPath();
    bgCtx.moveTo(gx, gy);
    bgCtx.quadraticCurveTo(gx + Math.sin(i + t*0.0005)*6, gy - gh*0.6, gx + Math.sin(i*0.8)*3, gy - gh);
    bgCtx.strokeStyle = `rgba(38,72,22,${0.35 + (i%4)*0.1})`;
    bgCtx.lineWidth = 1.2; bgCtx.stroke();
  }

  // Small wildflowers in grass
  [[0.08,0.52],[0.18,0.54],[0.32,0.51],[0.44,0.53],[0.56,0.52],[0.7,0.54],[0.82,0.51],[0.92,0.53]].forEach(([fx,fy],i) => {
    const flx = fx * W + Math.sin(t * 0.0004 + i) * 3;
    const fly = fy * H;
    const r = 3.5;
    const petalC = i % 2 === 0 ? 'rgba(255,200,210,0.7)' : 'rgba(255,240,160,0.7)';
    for (let k = 0; k < 6; k++) {
      const a = k * TAU/6;
      bgCtx.beginPath();
      bgCtx.ellipse(flx + Math.cos(a)*r*1.8, fly + Math.sin(a)*r*1.8, r, r*0.55, a, 0, TAU);
      bgCtx.fillStyle = petalC; bgCtx.fill();
    }
    bgCtx.beginPath(); bgCtx.arc(flx, fly, r*0.7, 0, TAU);
    bgCtx.fillStyle = 'rgba(255,220,100,0.85)'; bgCtx.fill();
  });

  // Warm edge vignette — frames the scene
  const vig = bgCtx.createRadialGradient(W*0.5, H*0.56, Math.min(W,H)*0.22, W*0.5, H*0.56, Math.max(W,H)*0.74);
  vig.addColorStop(0, 'rgba(0,0,0,0)');
  vig.addColorStop(1, 'rgba(8,18,4,0.42)');
  bgCtx.fillStyle = vig; bgCtx.fillRect(0, 0, W, H);
}

// ─── SVG helpers ─────────────────────────────────────────────────────────────

const GOLD  = 'rgba(255,208,100,0.62)';
const IVRY  = 'rgba(255,252,230,0.55)';
const GREEN = 'rgba(130,210,105,0.58)';
const ROSE  = 'rgba(255,180,160,0.6)';
const SKY   = 'rgba(180,220,255,0.55)';
const cos   = (a) => Math.cos(a).toFixed(2);
const sin   = (a) => Math.sin(a).toFixed(2);

function S(vb, w, h, stroke, body) {
  return `<svg viewBox="${vb}" width="${w}" height="${h}" fill="none" stroke="${stroke}" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round">${body}</svg>`;
}

// ─── Card definitions ─────────────────────────────────────────────────────────

const CARDS = [

  // ═══ DIVINE ═══════════════════════════════════════════════════════════════

  { cat:'divine', label:'Ankh',
    art: S('-44 -68 88 108', 78, 96, GOLD, `
      <ellipse cx="0" cy="-26" rx="20" ry="25"/>
      <line x1="0" y1="-1" x2="0" y2="38"/>
      <line x1="-26" y1="10" x2="26" y2="10"/>
      ${[0,1,2,3,4,5].map(i=>`<circle cx="${cos(i*TAU/6+0.3)*46}" cy="${sin(i*TAU/6+0.3)*38-8}" r="1.2" fill="${GOLD}" stroke="none" opacity=".4"/>`).join('')}
    `)
  },

  { cat:'divine', label:'Tree of Life',
    art: S('-52 -64 104 128', 86, 106, GOLD, `
      <circle cx="0" cy="-57" r="5.5"/><circle cx="32" cy="-37" r="4.5"/><circle cx="-32" cy="-37" r="4.5"/>
      <circle cx="32" cy="-7"  r="4.5"/><circle cx="-32" cy="-7"  r="4.5"/><circle cx="0"   cy="5"   r="5.5"/>
      <circle cx="32" cy="26"  r="4.5"/><circle cx="-32" cy="26"  r="4.5"/><circle cx="0"   cy="44"  r="4.5"/>
      <circle cx="0"  cy="60"  r="5.5"/>
      <line x1="0" y1="-51" x2="32" y2="-42"/><line x1="0" y1="-51" x2="-32" y2="-42"/>
      <line x1="0" y1="-51" x2="0" y2="-1"/><line x1="32" y1="-32" x2="-32" y2="-32" opacity=".3"/>
      <line x1="32" y1="-32" x2="32" y2="-12"/><line x1="-32" y1="-32" x2="-32" y2="-12"/>
      <line x1="32" y1="-2" x2="0" y2="10"/><line x1="-32" y1="-2" x2="0" y2="10"/>
      <line x1="32" y1="-2" x2="-32" y2="-2" opacity=".25"/>
      <line x1="32" y1="21" x2="0" y2="10"/><line x1="-32" y1="21" x2="0" y2="10"/>
      <line x1="0" y1="10" x2="0" y2="39"/><line x1="32" y1="21" x2="-32" y2="21" opacity=".25"/>
      <line x1="32" y1="31" x2="0" y2="49"/><line x1="-32" y1="31" x2="0" y2="49"/>
      <line x1="0" y1="49" x2="0" y2="55"/>
    `)
  },

  { cat:'divine', label:'Lotus',
    art: S('-56 -56 112 80', 88, 80, GOLD, `
      ${[0,1,2,3,4,5,6,7].map(i=>{
        const a=i*TAU/8, r=36;
        const px=Math.cos(a)*r, py=Math.sin(a)*r;
        const q1x=Math.cos(a-0.45)*22, q1y=Math.sin(a-0.45)*22;
        const q2x=Math.cos(a+0.45)*22, q2y=Math.sin(a+0.45)*22;
        return `<path d="M 0,0 Q ${q1x.toFixed(1)},${q1y.toFixed(1)} ${px.toFixed(1)},${py.toFixed(1)} Q ${q2x.toFixed(1)},${q2y.toFixed(1)} 0,0 Z" opacity=".72"/>`;
      }).join('')}
      <circle cx="0" cy="0" r="11"/>
      <circle cx="0" cy="0" r="4.5" fill="${GOLD}" stroke="none" opacity=".45"/>
    `)
  },

  { cat:'divine', label:'Eye of Ra',
    art: S('-60 -44 120 88', 90, 66, GOLD, `
      <path d="M -54,0 Q -12,-34 0,-34 Q 12,-34 54,0 Q 12,34 0,34 Q -12,34 -54,0 Z"/>
      <circle cx="0" cy="0" r="18"/>
      <circle cx="0" cy="0" r="7" fill="${GOLD}" stroke="none" opacity=".4"/>
      <circle cx="6" cy="-5" r="3" fill="rgba(255,255,255,0.5)" stroke="none"/>

      <path d="M -44,-44 A 44,44 0 0,1 0,0" stroke-width="0.9" opacity=".65"/>
      <path d="M -44,-44 Q -44,8 0,0" opacity=".3"/>
      ${[0,1,2,3].map(i=>`<circle cx="${[-44,0,0,17][i]}" cy="${[-44,-44,0,0][i]}" r="2" fill="${IVRY}" stroke="none" opacity=".4"/>`).join('')}
    `)
  },
];

// ─── Build cards ──────────────────────────────────────────────────────────────

const stageEl = document.getElementById('stage');
const cards   = [];

function buildCards() {
  CARDS.forEach((def, i) => {
    const el  = document.createElement('div');
    el.className = 'card ' + (def.cat || 'core');

    // Art layer (fills card)
    const artDiv = document.createElement('div');
    artDiv.className = 'card-art';
    artDiv.innerHTML = def.art || '';
    el.appendChild(artDiv);

    // Content layer
    const content = document.createElement('div');
    content.className = 'card-content';
    if (def.symbol) {
      const s = document.createElement('div');
      s.className = 'card-symbol';
      s.textContent = def.symbol;
      content.appendChild(s);
    }
    if (def.text) {
      const t = document.createElement('div');
      t.className = 'card-text ' + (def.textClass || '');
      t.innerHTML = def.text.replace(/\n/g, '<br>');
      content.appendChild(t);
    }
    el.appendChild(content);

    // Index
    const idx = document.createElement('div');
    idx.className = 'card-index';
    idx.textContent = String(i+1).padStart(2,'0');
    el.appendChild(idx);

    // Tag
    if (def.cat && def.cat !== 'core') {
      const tag = document.createElement('div');
      tag.className = 'card-tag';
      tag.textContent = def.cat.toUpperCase();
      el.appendChild(tag);
    }

    // Label
    const lbl = document.createElement('div');
    lbl.className = 'card-label';
    lbl.textContent = def.label.toUpperCase();
    el.appendChild(lbl);

    stageEl.appendChild(el);

    const a = (i / CARDS.length) * TAU;
    const r = Math.min(W, H) * 0.25;
    const card = {
      el, def, i,
      x: cx, y: cy,
      hx: cx + Math.cos(a)*r, hy: cy + Math.sin(a)*r,
      vx:0, vy:0, rotX:0, rotY:0, rotZ:0, scale:0,
      depth: 0.75 + Math.random()*0.5,
      phase: Math.random()*TAU,
      floatAmp: 2 + Math.random()*5,
      floatFreq: 0.003 + Math.random()*0.004,
      born: false,
    };
    el.style.opacity = '0';
    cards.push(card);
  });
}

// ─── Arrangements ─────────────────────────────────────────────────────────────

const ARRS = {
  drift(cards, t) {
    cards.forEach((c,i) => {
      const a = (i/cards.length)*TAU + t*0.0001;
      c.hx = cx + Math.cos(a)*Math.min(W,H)*0.27;
      c.hy = cy + Math.sin(a)*Math.min(W,H)*0.27;
    });
  },
  grid(cards) {
    const cols=Math.ceil(Math.sqrt(cards.length)), pw=136, ph=190;
    const ox=-(cols-1)*pw/2, oy=-(Math.ceil(cards.length/cols)-1)*ph/2;
    cards.forEach((c,i) => { c.hx=cx+ox+(i%cols)*pw; c.hy=cy+oy+Math.floor(i/cols)*ph; c.rotZ=0; });
  },
  divine(cards) {
    const d=cards.filter(c=>c.def.cat==='divine'), o=cards.filter(c=>c.def.cat!=='divine');
    d.forEach((c,i) => { const a=i*TAU/d.length-TAU/4; c.hx=cx+Math.cos(a)*Math.min(W,H)*0.3; c.hy=cy+Math.sin(a)*Math.min(W,H)*0.3; c.rotZ=0; });
    o.forEach((c,i) => { const a=i*TAU/o.length; c.hx=cx+Math.cos(a)*Math.min(W,H)*0.14; c.hy=cy+Math.sin(a)*Math.min(W,H)*0.14; c.rotZ=0; });
  },
  forest(cards) {
    const f=cards.filter(c=>c.def.cat==='forest'), o=cards.filter(c=>c.def.cat!=='forest');
    f.forEach((c,i) => { const a=i*TAU/f.length-TAU/4; c.hx=cx+Math.cos(a)*Math.min(W,H)*0.3; c.hy=cy+Math.sin(a)*Math.min(W,H)*0.3; c.rotZ=0; });
    o.forEach((c,i) => { const a=i*TAU/o.length; c.hx=cx+Math.cos(a)*Math.min(W,H)*0.14; c.hy=cy+Math.sin(a)*Math.min(W,H)*0.14; c.rotZ=0; });
  },
  garden(cards) {
    const g=cards.filter(c=>c.def.cat==='garden'), o=cards.filter(c=>c.def.cat!=='garden');
    g.forEach((c,i) => { const a=i*TAU/g.length-TAU/4; c.hx=cx+Math.cos(a)*Math.min(W,H)*0.28; c.hy=cy+Math.sin(a)*Math.min(W,H)*0.28; c.rotZ=0; });
    o.forEach((c,i) => { const a=i*TAU/o.length; c.hx=cx+Math.cos(a)*Math.min(W,H)*0.14; c.hy=cy+Math.sin(a)*Math.min(W,H)*0.14; c.rotZ=0; });
  },
  fan(cards) {
    const n=cards.length, fw=Math.min(W*0.86,n*36);
    cards.forEach((c,i) => {
      const p=n>1?i/(n-1):0.5;
      c.hx=cx-fw/2+p*fw; c.hy=cy*1.06+Math.sin(p*Math.PI)*-H*0.13; c.rotZ=(p-0.5)*22;
    });
  },
  stack(cards) {
    cards.forEach((c,i) => { c.hx=cx+(i-cards.length/2)*1.8; c.hy=cy+(i-cards.length/2)*0.9; c.rotZ=(i-cards.length/2)*2.8; });
  },
  spiral(cards) {
    cards.forEach((c,i) => { const a=i*0.72*TAU,r=12+i*13; c.hx=cx+Math.cos(a)*r; c.hy=cy+Math.sin(a)*r; c.rotZ=0; });
  },
};
const ARR_KEYS = Object.keys(ARRS);
let arrIdx=0, currentArr='drift';

function setArr(name) {
  if (!ARRS[name]) return;
  currentArr=name; arrIdx=ARR_KEYS.indexOf(name);
  if (['grid','drift','spiral','divine','forest','garden'].includes(name))
    cards.forEach(c => { c.rotZ=0; });
  document.getElementById('hud-l').textContent=name.toUpperCase();
}

// ─── Physics ──────────────────────────────────────────────────────────────────

const K=0.052, DMP=0.79;
const ptr = {x:cx,y:cy,vx:0,vy:0,speed:0};
let pullMode=false, grabbedCard=null;

// ─── Landmark smoothing state ─────────────────────────────────────────────────
let smoothLM = null;          // EMA-smoothed landmark array
const LM_SMOOTH  = 0.38;      // landmark EMA alpha  (0=frozen, 1=raw)
const PTR_SMOOTH = 0.26;      // pointer EMA alpha   (lower = silkier, more lag)
let noHandFrames = 0;         // grace period before releasing grab on lost tracking
const NO_HAND_GRACE = 10;     // frames before we actually release
let smoothSpeed  = 0;         // velocity magnitude, also EMA-smoothed

function applyLMSmooth(raw) {
  if (!smoothLM || smoothLM.length !== raw.length) {
    smoothLM = raw.map(p => ({x:p.x, y:p.y, z:p.z||0}));
    return smoothLM;
  }
  for (let i = 0; i < raw.length; i++) {
    smoothLM[i].x += (raw[i].x - smoothLM[i].x) * LM_SMOOTH;
    smoothLM[i].y += (raw[i].y - smoothLM[i].y) * LM_SMOOTH;
    smoothLM[i].z += ((raw[i].z||0) - smoothLM[i].z) * LM_SMOOTH;
  }
  return smoothLM;
}

function tick(t) {
  ARRS[currentArr](cards, t);
  const mx=ptr.x, my=ptr.y, spd=ptr.speed;
  // Update hand pointer visual state
  document.getElementById('hand-ptr').classList.toggle('grabbing', !!grabbedCard);
  cards.forEach(c => {
    if (!c.born) return;
    if (c===grabbedCard) {
      // Damped spring follow — smooth pull, no snap
      const dx=mx-c.x, dy=my-c.y;
      c.vx = c.vx*0.55 + dx*0.22;
      c.vy = c.vy*0.55 + dy*0.22;
      c.x+=c.vx; c.y+=c.vy;
      c.rotX*=0.85; c.rotY*=0.85; c.scale=c.scale*0.92+1.08*0.08;
    } else {
      c.vx=(c.vx+(c.hx-c.x)*K*(0.65+0.5*c.depth))*DMP;
      c.vy=(c.vy+(c.hy-c.y)*K*(0.65+0.5*c.depth))*DMP;
      const dx=mx-c.x, dy=my-c.y, infl=Math.max(0,1-Math.hypot(dx,dy)/200);
      if (pullMode&&infl>0.1) { c.vx+=dx*0.030*infl; c.vy+=dy*0.030*infl; }
      else if (spd>3.5&&infl>0.04) {
        const ang=Math.atan2(dy,dx), push=spd*0.18*infl;
        c.vx-=Math.cos(ang)*push; c.vy-=Math.sin(ang)*push;
      }
      c.x+=c.vx; c.y+=c.vy;
      const tilt=Math.min(infl*12,9);
      c.rotX=c.rotX*0.90+(-((my-cy)/(H/2))*tilt)*0.10;
      c.rotY=c.rotY*0.90+(((mx-cx)/(W/2))*tilt)*0.10;
      c.scale=c.scale*0.94+(1+infl*0.05)*0.06;
    }
    const fx=Math.cos(t*c.floatFreq+c.phase)*c.floatAmp*0.4;
    const fy=Math.sin(t*c.floatFreq*1.3+c.phase)*c.floatAmp;
    c.el.classList.toggle('hovered', Math.hypot(mx-c.x,my-c.y)<140 && c!==grabbedCard);
    c.el.classList.toggle('grabbed', c===grabbedCard);
    c.el.style.transform=
      `translate(calc(${c.x+fx}px - 50%), calc(${c.y+fy}px - 50%))
       rotateX(${c.rotX.toFixed(2)}deg) rotateY(${c.rotY.toFixed(2)}deg)
       rotateZ(${c.rotZ.toFixed(2)}deg) scale(${c.scale.toFixed(4)})`;
    const targetOp = 0.55 + c.depth * 0.45;
    c.el.style.opacity = targetOp.toFixed(2);
    c.el.style.zIndex=Math.round(c.depth*10+(c===grabbedCard?200:0));
  });
}

function nearestCard(x,y,maxD=170) {
  let best=null, bestD=maxD;
  cards.forEach(c=>{const d=Math.hypot(c.x-x,c.y-y);if(d<bestD){bestD=d;best=c;}});
  return best;
}
function scatter() {
  cards.forEach(c=>{
    const ang=Math.atan2(c.y-ptr.y,c.x-ptr.x),f=6+Math.random()*10;
    c.vx+=Math.cos(ang)*f; c.vy+=Math.sin(ang)*f;
  });
}

// ─── Touch flash ─────────────────────────────────────────────────────────────

let flashTimer=null;
function flash(txt) {
  const el=document.getElementById('touch-flash');
  el.textContent=txt; el.style.color='rgba(255,255,255,0.6)';
  clearTimeout(flashTimer);
  flashTimer=setTimeout(()=>{el.style.color='rgba(255,255,255,0)';},950);
  document.getElementById('hud-t').textContent=txt;
}

// ─── Hand tracking + touch mapping ───────────────────────────────────────────

const videoEl  = document.getElementById('cam-video');
const camCv    = document.getElementById('cam-canvas');
const camCtx   = camCv.getContext('2d');
const CONN = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[0,9],[9,10],[10,11],[11,12],
              [0,13],[13,14],[14,15],[15,16],[0,17],[17,18],[18,19],[19,20],[5,9],[9,13],[13,17]];

const TOUCH_MAP = {
  'thumb+index':  {action:'grab',   label:'GRAB'},
  'thumb+middle': {action:'scatter',label:'SCATTER'},
  'thumb+ring':   {action:'divine', label:'DIVINE LAYOUT'},
  'thumb+pinky':  {action:'forest', label:'FOREST LAYOUT'},
  'index+middle': {action:'grid',   label:'GRID'},
  'index+ring':   {action:'fan',    label:'FAN'},
  'index+pinky':  {action:'spiral', label:'SPIRAL'},
  'middle+ring':  {action:'stack',  label:'STACK'},
  'ring+pinky':   {action:'garden', label:'GARDEN LAYOUT'},
};
const TOUCH_ST={}, TOUCH_CD={};

// Hysteresis thresholds — wider release zone prevents boundary flicker
const TOUCH_ON  = 0.060;
const TOUCH_OFF = 0.082;

function checkTouch(lm,i1,i2,key) {
  const td  = Math.hypot(lm[i1].x-lm[i2].x, lm[i1].y-lm[i2].y);
  const was = TOUCH_ST[key] || false;
  const on  = td < (was ? TOUCH_OFF : TOUCH_ON);   // hysteresis
  if (on && !was && (!TOUCH_CD[key] || TOUCH_CD[key]<=0)) {
    TOUCH_ST[key]=true; TOUCH_CD[key]=28; return true;
  }
  if (!on && was) TOUCH_ST[key]=false;
  if (TOUCH_CD[key]>0) TOUCH_CD[key]--;
  return false;
}

function execTouch(action,lm) {
  const ix=(1-lm[8].x)*W, iy=lm[8].y*H;
  ({grab:()=>{const c=nearestCard(ix,iy,200);if(c){grabbedCard=c;pullMode=true;}},
    scatter:()=>{scatter();grabbedCard=null;pullMode=false;},
    divine:()=>setArr('divine'), forest:()=>setArr('forest'),
    garden:()=>setArr('garden'), grid:()=>setArr('grid'),
    fan:()=>setArr('fan'), spiral:()=>setArr('spiral'), stack:()=>setArr('stack'),
  })[action]?.();
}

function classifyGesture(lm) {
  const ext=(t,m)=>lm[t].y<lm[m].y-0.04;
  const ie=ext(8,5),me=ext(12,9),re=ext(16,13),pe=ext(20,17);
  const sp=[ie,me,re,pe].filter(Boolean).length;
  const pd=Math.hypot(lm[4].x-lm[8].x,lm[4].y-lm[8].y);
  if(pd<0.065) return sp>=3?'ok':'pinch';
  if(ie&&pe&&!me&&!re) return 'rock';
  if(ie&&me&&!re&&!pe) return 'peace';
  if(ie&&!me&&!re&&!pe) return 'point';
  if(sp===4) return 'open';
  if(sp===0) return 'fist';
  return 'none';
}

let handActive=false, gestHold=0, lastGest='none', confirmedGest='none';

function onHandResults(results) {
  // Sync cam canvas size once per resolution change
  const vw = videoEl.videoWidth||320, vh = videoEl.videoHeight||240;
  if (camCv.width!==vw || camCv.height!==vh) { camCv.width=vw; camCv.height=vh; }
  camCtx.clearRect(0,0,camCv.width,camCv.height);

  if (!results.multiHandLandmarks?.length) {
    noHandFrames++;
    if (noHandFrames >= NO_HAND_GRACE) {
      handActive=false; grabbedCard=null; pullMode=false; smoothLM=null;
      document.getElementById('cam-label').textContent='○ SEARCHING';
      document.getElementById('hand-ptr').style.display='none';
    }
    return;
  }
  noHandFrames=0;
  handActive=true;
  document.getElementById('cam-label').textContent='● TRACKING';

  // Apply per-landmark EMA smoothing before any logic
  const lm = applyLMSmooth(results.multiHandLandmarks[0]);
  const cw=camCv.width, ch=camCv.height;

  // Draw skeleton on pip cam
  CONN.forEach(([a,b])=>{
    camCtx.beginPath();
    camCtx.moveTo(lm[a].x*cw,lm[a].y*ch);
    camCtx.lineTo(lm[b].x*cw,lm[b].y*ch);
    camCtx.strokeStyle='rgba(160,220,140,0.55)'; camCtx.lineWidth=1.1; camCtx.stroke();
  });
  [4,8,12,16,20].forEach(i=>{
    camCtx.beginPath(); camCtx.arc(lm[i].x*cw,lm[i].y*ch,2.8,0,TAU);
    camCtx.fillStyle='rgba(220,255,200,0.9)'; camCtx.fill();
  });

  // ── Pointer: EMA on screen coords → silky movement ──────────────────────────
  const rawX = (1-lm[8].x)*W, rawY = lm[8].y*H;
  const tX = ptr.x + (rawX - ptr.x) * PTR_SMOOTH;
  const tY = ptr.y + (rawY - ptr.y) * PTR_SMOOTH;
  const dX = tX - ptr.x, dY = tY - ptr.y;
  // EMA on speed so card-push force doesn't spike on single noisy frames
  smoothSpeed = smoothSpeed * 0.72 + Math.hypot(dX, dY) * 0.28;
  ptr.vx=dX; ptr.vy=dY; ptr.speed=smoothSpeed;
  ptr.x=tX; ptr.y=tY;

  const hp=document.getElementById('hand-ptr');
  hp.style.display='block'; hp.style.left=tX+'px'; hp.style.top=tY+'px';

  // ── Gesture debounce: require 4 steady frames before committing ──────────────
  const g=classifyGesture(lm);
  if (g===lastGest) { gestHold++; } else { gestHold=0; lastGest=g; }
  if (gestHold===4) { confirmedGest=g; document.getElementById('hud-g').textContent=g.toUpperCase(); }

  // ── Touch finger pairs (on smoothed LM) ─────────────────────────────────────
  [[4,8,'thumb+index'],[4,12,'thumb+middle'],[4,16,'thumb+ring'],[4,20,'thumb+pinky'],
   [8,12,'index+middle'],[8,16,'index+ring'],[8,20,'index+pinky'],
   [12,16,'middle+ring'],[16,20,'ring+pinky']].forEach(([i1,i2,key])=>{
    if (checkTouch(lm,i1,i2,key) && TOUCH_MAP[key]) {
      const m=TOUCH_MAP[key]; flash(m.label); execTouch(m.action,lm);
    }
  });

  if (!TOUCH_ST['thumb+index']) { pullMode=false; grabbedCard=null; }
}

// ─── Camera start ─────────────────────────────────────────────────────────────

function startCamera() {
  const hands=new Hands({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`});
  hands.setOptions({maxNumHands:1,modelComplexity:1,minDetectionConfidence:0.68,minTrackingConfidence:0.55});
  hands.onResults(onHandResults);
  const cam=new Camera(videoEl,{
    onFrame:async()=>{ camCv.width=videoEl.videoWidth||320; camCv.height=videoEl.videoHeight||240; await hands.send({image:videoEl}); },
    width:640,height:480,
  });
  cam.start().then(()=>{
    document.getElementById('cam-wrap').style.opacity='0.88';
    const p=document.getElementById('perm'); p.style.opacity='0';
    setTimeout(()=>p.style.display='none',600);
  }).catch(skipCam);
}
function skipCam() {
  const p=document.getElementById('perm'); p.style.opacity='0';
  setTimeout(()=>p.style.display='none',600);
}
document.getElementById('perm-btn').addEventListener('click',startCamera);
document.getElementById('skip-btn').addEventListener('click',skipCam);

// ─── Divine intro sequence ────────────────────────────────────────────────────

let introActive = true;

function spawnCards() {
  introActive = false;
  cards.forEach((c, i) => {
    setTimeout(() => {
      c.x  = cx + (Math.random()-0.5)*50;
      c.y  = cy + (Math.random()-0.5)*50;
      c.vx = (Math.random()-0.5)*16;
      c.vy = (Math.random()-0.5)*12;
      c.scale = 0.12;
      c.born = true;
      c.el.style.transition = 'opacity 0.55s ease-out';
    }, i * 58 + 80);
  });
}

function runIntro() {
  const cv  = document.getElementById('intro');
  const ctx = cv.getContext('2d');
  cv.width  = W; cv.height = H;

  const sparks = Array.from({length:44}, () => ({
    a:  Math.random()*TAU,
    r:  22 + Math.random()*108,
    s:  0.28 + Math.random()*0.72,
    ph: Math.random()*TAU,
  }));

  const DUR   = 4600; // ms total
  const START = performance.now();

  function drawIntroRing(t, r, tS, tE, ccw, op) {
    const p = Math.max(0, Math.min((t-tS)/(tE-tS), 1));
    if (p <= 0) return;
    const ox=W/2, oy=H/2, a0=-Math.PI/2;
    ctx.beginPath();
    ctx.arc(ox, oy, r, a0, a0 + (ccw?-1:1)*Math.PI*2*p, ccw);
    ctx.strokeStyle = `rgba(255,214,90,${op})`;
    ctx.lineWidth = 0.75;
    ctx.stroke();
  }

  function drawLetter(ch, ox, x, y, alpha) {
    ctx.save();
    ctx.shadowColor = 'rgba(255,210,80,0.7)';
    ctx.shadowBlur  = 18;
    ctx.fillStyle   = `rgba(255,248,215,${alpha})`;
    ctx.fillText(ch, ox + x, y);
    ctx.shadowBlur  = 0;
    ctx.restore();
  }

  function frame(now) {
    const t       = Math.min((now - START) / DUR, 1);
    const bgAlpha = t < 0.64 ? 1 : Math.max(0, 1-(t-0.64)/0.36);
    const gAlpha  = t < 0.64 ? Math.min(t/0.07, 1) : Math.max(0, 1-(t-0.64)/0.28);

    ctx.clearRect(0, 0, W, H);

    // Dark background
    if (bgAlpha > 0.005) {
      ctx.fillStyle = `rgba(5,3,12,${bgAlpha})`;
      ctx.fillRect(0, 0, W, H);
    }

    const ox = W/2, oy = H/2;

    if (gAlpha > 0.005) {
      ctx.save();
      ctx.globalAlpha = gAlpha;

      // Center radial glow
      const cg = ctx.createRadialGradient(ox, oy, 0, ox, oy, 68);
      cg.addColorStop(0,   'rgba(255,235,140,0.38)');
      cg.addColorStop(0.4, 'rgba(255,218,90,0.12)');
      cg.addColorStop(1,   'rgba(255,195,50,0)');
      ctx.fillStyle = cg; ctx.fillRect(0, 0, W, H);

      // Concentric rings draw themselves in
      drawIntroRing(t, 40,  0.04, 0.30, false, 0.62);
      drawIntroRing(t, 68,  0.10, 0.36, true,  0.46);
      drawIntroRing(t, 98,  0.17, 0.43, false, 0.30);
      drawIntroRing(t, 130, 0.23, 0.50, true,  0.17);
      drawIntroRing(t, 162, 0.28, 0.56, false, 0.10);

      // 6-fold radial lines
      const lineP = Math.max(0, Math.min((t-0.14)/0.26, 1));
      if (lineP > 0) {
        for (let i = 0; i < 6; i++) {
          const a = i*Math.PI/3 - Math.PI/6;
          ctx.beginPath();
          ctx.moveTo(ox, oy);
          ctx.lineTo(ox+Math.cos(a)*148*lineP, oy+Math.sin(a)*148*lineP);
          ctx.strokeStyle = `rgba(255,218,100,${0.18*lineP})`;
          ctx.lineWidth = 0.65;
          ctx.stroke();
        }
      }

      // Intersection accent dots
      const dotP = Math.max(0, Math.min((t-0.28)/0.18, 1));
      if (dotP > 0) {
        for (let i = 0; i < 6; i++) {
          const a = i*Math.PI/3 - Math.PI/6;
          ctx.beginPath();
          ctx.arc(ox+Math.cos(a)*68, oy+Math.sin(a)*68, 3.2*dotP, 0, TAU);
          ctx.strokeStyle = `rgba(255,225,130,${0.62*dotP})`;
          ctx.lineWidth = 0.75;
          ctx.stroke();
        }
        // Outer 12 dots
        const dot2P = Math.max(0, Math.min((t-0.34)/0.14, 1));
        if (dot2P > 0) {
          for (let i = 0; i < 12; i++) {
            const a = i*Math.PI/6;
            ctx.beginPath();
            ctx.arc(ox+Math.cos(a)*130, oy+Math.sin(a)*130, 1.8*dot2P, 0, TAU);
            ctx.strokeStyle = `rgba(255,230,150,${0.38*dot2P})`;
            ctx.lineWidth = 0.6;
            ctx.stroke();
          }
        }
      }

      // Chord lines connecting ring intersections
      const chordP = Math.max(0, Math.min((t-0.34)/0.22, 1));
      if (chordP > 0) {
        for (let i = 0; i < 6; i++) {
          const a1 = i*Math.PI/3-Math.PI/6, a2=(i+2)*Math.PI/3-Math.PI/6;
          const x1=ox+Math.cos(a1)*68, y1=oy+Math.sin(a1)*68;
          const x2=ox+Math.cos(a2)*68, y2=oy+Math.sin(a2)*68;
          const mx2=x1+(x2-x1)*chordP, my2=y1+(y2-y1)*chordP;
          ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(mx2,my2);
          ctx.strokeStyle=`rgba(255,220,110,${0.20*chordP})`;
          ctx.lineWidth=0.6; ctx.stroke();
        }
      }

      // Floating sparks
      const spkP = Math.max(0, Math.min((t-0.22)/0.32, 1)) * (t<0.58?1:Math.max(0,1-(t-0.58)/0.14));
      if (spkP > 0) {
        sparks.forEach(sp => {
          const sx = ox + Math.cos(sp.a + t*0.28) * sp.r;
          const sy = oy + Math.sin(sp.a + t*0.28*sp.s) * sp.r * 0.65;
          const bri = (Math.sin(t*7*sp.s + sp.ph)*0.5+0.5) * spkP;
          if (bri < 0.02) return;
          ctx.beginPath();
          ctx.arc(sx, sy, 1, 0, TAU);
          ctx.fillStyle = `rgba(255,235,155,${bri*0.72})`;
          ctx.fill();
        });
      }

      ctx.restore();
    }

    // Text layer — appears and fades independently
    const textAlpha = t>0.37 ? Math.min((t-0.37)/0.16,1)*(t<0.60?1:Math.max(0,1-(t-0.60)/0.32)) : 0;
    if (textAlpha > 0.01) {
      ctx.save();
      ctx.textAlign    = 'center';
      ctx.textBaseline = 'middle';
      ctx.font         = '300 20px "Courier New", monospace';

      // Letter-by-letter reveal of E U D A I M O N
      const letters = 'EUDAIMON'.split('');
      const spacing = 24;
      const totalW  = (letters.length-1)*spacing;
      letters.forEach((ch, li) => {
        const lT = Math.max(0, Math.min((t-0.37-li*0.012)/0.10, 1)) * textAlpha;
        if (lT > 0.01) drawLetter(ch, ox, -totalW/2 + li*spacing, oy-16, lT);
      });

      // Subtitle
      const subA = t>0.50 ? Math.min((t-0.50)/0.12,1)*textAlpha : 0;
      if (subA > 0.01) {
        ctx.font      = '300 7.5px "Courier New", monospace';
        ctx.fillStyle = `rgba(255,232,172,${subA*0.48})`;
        ctx.fillText('G A R D E N  ·  2 0 2 6', ox, oy+16);
      }
      ctx.restore();
    }

    if (t < 1) {
      requestAnimationFrame(frame);
    } else {
      cv.style.display = 'none';
      spawnCards();
    }
  }

  requestAnimationFrame(frame);
}

// ─── Keyboard ─────────────────────────────────────────────────────────────────

window.addEventListener('keydown',e=>{
  const m={'1':'drift','2':'grid','3':'fan','4':'stack','5':'spiral','6':'divine','7':'forest','8':'garden'};
  if(m[e.key]) setArr(m[e.key]);
  if(e.key===' '){e.preventDefault();scatter();}
  if(e.key==='Tab'){e.preventDefault();arrIdx=(arrIdx+1)%ARR_KEYS.length;setArr(ARR_KEYS[arrIdx]);}
});

window.addEventListener('resize',()=>{
  W=innerWidth; H=innerHeight; cx=W/2; cy=H/2;
  bgCv.width=W; bgCv.height=H;
  const ic=document.getElementById('intro');
  if (ic.style.display!=='none') { ic.width=W; ic.height=H; }
});

// ─── Main loop ────────────────────────────────────────────────────────────────

let frame=0;
function loop(ts) {
  requestAnimationFrame(loop); frame++;
  drawGarden(ts);
  if (!introActive) tick(ts);
}

bgCv.width=W; bgCv.height=H;
buildCards();
setArr('drift');
requestAnimationFrame(loop);
runIntro();
</script>
