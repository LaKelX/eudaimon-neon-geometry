<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eudaimon — Art Cards</title>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#060606; overflow:hidden; font-family:'Georgia',serif; cursor:none; user-select:none; }

#cursor { position:fixed; width:5px; height:5px; background:rgba(255,255,255,0.8); border-radius:50%; pointer-events:none; z-index:9999; transform:translate(-50%,-50%); }
#cursor-ring { position:fixed; width:34px; height:34px; border:1px solid rgba(255,255,255,0.2); border-radius:50%; pointer-events:none; z-index:9998; transform:translate(-50%,-50%); transition:width .22s,height .22s,border-color .25s; }

/* ── Cards ── */
.card {
  position:absolute; width:155px; height:215px;
  border-radius:12px; border:1px solid rgba(255,255,255,0.06);
  background:rgba(9,9,9,0.96);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
  pointer-events:all; will-change:transform; overflow:hidden;
  transition:border-color .35s, box-shadow .35s;
}
.card::before {
  content:''; position:absolute; inset:0;
  background:linear-gradient(145deg,rgba(255,255,255,0.022) 0%,transparent 55%);
  border-radius:inherit; pointer-events:none;
}
.card.divine  { border-color:rgba(255,220,120,0.08); }
.card.forest  { border-color:rgba(100,180,100,0.08); }
.card.hovered { border-color:rgba(255,255,255,0.13) !important; }
.card.grabbed { border-color:rgba(140,210,255,0.35) !important; box-shadow:0 0 28px rgba(140,210,255,0.08); }
.card.divine.hovered { border-color:rgba(255,220,120,0.22) !important; box-shadow:0 0 20px rgba(255,200,80,0.06); }
.card.forest.hovered { border-color:rgba(100,200,100,0.22) !important; box-shadow:0 0 20px rgba(80,180,80,0.06); }

.card-label { font-size:7.5px; letter-spacing:.26em; color:rgba(255,255,255,0.16); text-transform:uppercase; font-family:'Courier New',monospace; position:absolute; bottom:14px; left:0; right:0; text-align:center; }
.card-index  { font-size:7px; letter-spacing:.14em; color:rgba(255,255,255,0.07); font-family:'Courier New',monospace; position:absolute; top:13px; left:14px; }
.card-tag    { font-size:6.5px; letter-spacing:.18em; color:rgba(255,255,255,0.1); font-family:'Courier New',monospace; position:absolute; top:13px; right:14px; }

.card-text { color:rgba(255,255,255,0.7); font-size:11.5px; line-height:1.7; text-align:center; padding:0 18px; letter-spacing:.04em; }
.card-text.serif { font-style:italic; }
.card-text.mono  { font-family:'Courier New',monospace; font-size:9.5px; letter-spacing:.09em; }
.card-symbol { font-size:44px; color:rgba(255,255,255,0.62); line-height:1; font-family:'Georgia',serif; }
.card-field  { position:absolute; inset:0; border-radius:inherit; }

/* ── Touch badge ── */
#touch-badge {
  position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
  font-family:'Courier New',monospace; font-size:10px; letter-spacing:.24em;
  color:rgba(255,255,255,0); pointer-events:none; z-index:300;
  transition:color .15s, opacity .5s;
  text-align:center; line-height:2;
}

/* ── Webcam pip ── */
#cam-wrap { position:fixed; bottom:22px; right:22px; width:192px; height:144px; border-radius:11px; overflow:hidden; border:1px solid rgba(255,255,255,0.07); z-index:200; }
#cam-video { position:absolute; width:100%; height:100%; object-fit:cover; transform:scaleX(-1); opacity:0.5; }
#cam-canvas { position:absolute; width:100%; height:100%; transform:scaleX(-1); }
#cam-label { position:absolute; bottom:8px; left:10px; font-family:'Courier New',monospace; font-size:7px; letter-spacing:.15em; color:rgba(255,255,255,0.3); }

/* ── Hand pointer ── */
#hand-ptr { position:fixed; pointer-events:none; z-index:150; width:14px; height:14px; border-radius:50%; transform:translate(-50%,-50%); border:1px solid rgba(140,210,255,0.45); display:none; transition:width .12s,height .12s; }
#hand-ptr::after { content:''; position:absolute; inset:3px; border-radius:50%; background:rgba(140,210,255,0.18); }

/* ── UI ── */
#wordmark { position:fixed; top:26px; left:26px; pointer-events:none; }
#wordmark h1 { font-size:10.5px; font-weight:400; letter-spacing:.32em; color:rgba(255,255,255,0.32); font-family:'Courier New',monospace; }
#wordmark p  { font-size:7.5px; letter-spacing:.18em; color:rgba(255,255,255,0.1); margin-top:4px; font-family:'Courier New',monospace; }

#hud { position:fixed; top:26px; right:26px; text-align:right; pointer-events:none; font-family:'Courier New',monospace; font-size:8px; letter-spacing:.18em; line-height:2; color:rgba(255,255,255,0.15); }
#hud .v { color:rgba(140,210,255,0.55); }

#gesture-log { position:fixed; bottom:26px; left:26px; font-family:'Courier New',monospace; font-size:8px; letter-spacing:.14em; color:rgba(255,255,255,0.12); pointer-events:none; line-height:2; }

/* ── Permission overlay ── */
#perm { position:fixed; inset:0; background:rgba(0,0,0,0.88); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; z-index:1000; transition:opacity .5s; }
#perm h2 { font-family:'Courier New',monospace; font-size:10px; letter-spacing:.3em; color:rgba(255,255,255,0.55); font-weight:400; }
#perm p  { font-family:'Courier New',monospace; font-size:8px; letter-spacing:.16em; color:rgba(255,255,255,0.22); }
#perm-btn  { margin-top:6px; background:none; border:1px solid rgba(255,255,255,0.14); color:rgba(255,255,255,0.45); font-family:'Courier New',monospace; font-size:8.5px; letter-spacing:.2em; padding:10px 26px; border-radius:4px; cursor:pointer; transition:all .25s; }
#perm-btn:hover { border-color:rgba(140,210,255,0.35); color:rgba(140,210,255,0.8); }
#skip-btn { background:none; border:none; cursor:pointer; font-family:'Courier New',monospace; font-size:7.5px; letter-spacing:.14em; color:rgba(255,255,255,0.14); }
#skip-btn:hover { color:rgba(255,255,255,0.28); }
</style>
</head>
<body>

<div id="perm">
  <h2>EUDAIMON</h2>
  <p>Camera access enables live hand tracking</p>
  <button id="perm-btn">ENABLE CAMERA</button>
  <button id="skip-btn" style="margin-top:4px">Continue without camera</button>
</div>

<div id="cursor"></div>
<div id="cursor-ring"></div>
<div id="hand-ptr"></div>
<div id="touch-badge"></div>

<div id="wordmark"><h1>Eudaimon</h1><p>Visual System · 2026</p></div>
<div id="hud">
  GESTURE&nbsp;<span class="v" id="hud-g">—</span><br>
  TOUCH&nbsp;&nbsp;&nbsp;<span class="v" id="hud-t">—</span><br>
  LAYOUT&nbsp;&nbsp;<span class="v" id="hud-l">DRIFT</span>
</div>
<div id="gesture-log">
  SPACE scatter · DBL-CLICK cycle layout · 1–6 direct
</div>

<div id="cam-wrap" style="opacity:0">
  <video id="cam-video" autoplay muted playsinline></video>
  <canvas id="cam-canvas"></canvas>
  <div id="cam-label">● HAND TRACKING</div>
</div>

<div id="stage"></div>

<script>
const TAU=Math.PI*2;
let W=innerWidth,H=innerHeight,cx=W/2,cy=H/2;

// ─── Pointer (hand or mouse) ──────────────────────────────────────────────────
const ptr = {x:cx,y:cy,px:cx,py:cy,vx:0,vy:0,speed:0};
let handActive=false, pullMode=false, grabbedCard=null;
let frame=0, loopT=0;
let arrIdx=0, currentArr='drift';

// ─── Card definitions ─────────────────────────────────────────────────────────

// SVG helper
const S = (vb,w,h,stroke,content) =>
  `<svg viewBox="${vb}" width="${w}" height="${h}" fill="none" stroke="${stroke}" stroke-width="0.75" stroke-linecap="round" stroke-linejoin="round">${content}</svg>`;

const GOLD  = 'rgba(255,210,110,0.55)';
const BONE  = 'rgba(255,255,255,0.45)';
const GREEN = 'rgba(130,200,110,0.52)';

const CARD_DEFS = [

  // ═══════════════════════════════════════════
  // DIVINE ART
  // ═══════════════════════════════════════════

  { cat:'divine', type:'svg', label:'Ankh',
    svg: S('-44 -68 88 106','80','96',GOLD,`
      <ellipse cx="0" cy="-28" rx="20" ry="26"/>
      <line x1="0" y1="-2" x2="0" y2="36"/>
      <line x1="-26" y1="10" x2="26" y2="10"/>
    `)
  },

  { cat:'divine', type:'svg', label:'Tree of Life',
    svg: S('-52 -62 104 124','88','104',GOLD,`
      <!-- Sephirot nodes -->
      <circle cx="0"   cy="-56" r="6"/>
      <circle cx="32"  cy="-36" r="5"/>
      <circle cx="-32" cy="-36" r="5"/>
      <circle cx="32"  cy="-6"  r="5"/>
      <circle cx="-32" cy="-6"  r="5"/>
      <circle cx="0"   cy="6"   r="6"/>
      <circle cx="32"  cy="26"  r="5"/>
      <circle cx="-32" cy="26"  r="5"/>
      <circle cx="0"   cy="44"  r="5"/>
      <circle cx="0"   cy="60"  r="6"/>
      <!-- Paths -->
      <line x1="0" y1="-50" x2="32" y2="-41"/>
      <line x1="0" y1="-50" x2="-32" y2="-41"/>
      <line x1="0" y1="-50" x2="0" y2="0"/>
      <line x1="32" y1="-31" x2="-32" y2="-31" opacity=".35"/>
      <line x1="32" y1="-31" x2="32" y2="-11"/>
      <line x1="-32" y1="-31" x2="-32" y2="-11"/>
      <line x1="32" y1="-1"  x2="0" y2="0"/>
      <line x1="-32" y1="-1" x2="0" y2="0"/>
      <line x1="32" y1="-1"  x2="-32" y2="-1" opacity=".3"/>
      <line x1="32" y1="21"  x2="0" y2="10"/>
      <line x1="-32" y1="21" x2="0" y2="10"/>
      <line x1="0" y1="10"  x2="0" y2="39"/>
      <line x1="32" y1="21"  x2="-32" y2="21" opacity=".3"/>
      <line x1="0" y1="49"  x2="0" y2="54"/>
      <line x1="32" y1="31"  x2="0" y2="49"/>
      <line x1="-32" y1="31" x2="0" y2="49"/>
    `)
  },

  { cat:'divine', type:'svg', label:'Lotus',
    svg: S('-55 -55 110 110','88','88',GOLD,`
      ${[0,1,2,3,4,5,6,7].map(i=>{
        const a=i*TAU/8, r=34;
        const x=Math.cos(a)*r, y=Math.sin(a)*r;
        return `<path d="M 0,0 Q ${(Math.cos(a-0.4)*22).toFixed(1)},${(Math.sin(a-0.4)*22).toFixed(1)} ${x.toFixed(1)},${y.toFixed(1)} Q ${(Math.cos(a+0.4)*22).toFixed(1)},${(Math.sin(a+0.4)*22).toFixed(1)} 0,0 Z" opacity=".75"/>`;
      }).join('')}
      <circle cx="0" cy="0" r="10"/>
      <circle cx="0" cy="0" r="4" fill="${GOLD}" stroke="none" opacity=".5"/>
    `)
  },

  { cat:'divine', type:'svg', label:'Eye of Ra',
    svg: S('-60 -42 120 84','90','64',GOLD,`
      <path d="M -52,0 Q -10,-32 0,-32 Q 10,-32 52,0 Q 10,32 0,32 Q -10,32 -52,0 Z"/>
      <circle cx="0" cy="0" r="18"/>
      <circle cx="0" cy="0" r="7" fill="${GOLD}" stroke="none" opacity=".45"/>
      <circle cx="6" cy="-5" r="3" fill="rgba(255,255,255,0.5)" stroke="none"/>
      <line x1="0" y1="18" x2="0" y2="30" opacity=".5"/>
      <line x1="0" y1="30" x2="-8" y2="38" opacity=".5"/>
    `)
  },

  { cat:'divine', type:'svg', label:'Hamsa',
    svg: S('-40 -62 80 110','72','98',GOLD,`
      <!-- Palm -->
      <path d="M -28,20 Q -34,-10 -30,-38 Q -26,-52 -18,-52 Q -10,-52 -10,-32 L -10,2"/>
      <path d="M -10,2 L -10,-42 Q -10,-54 0,-54 Q 10,-54 10,-42 L 10,2"/>
      <path d="M 10,2 L 10,-32 Q 10,-52 18,-52 Q 26,-52 30,-38 Q 34,-10 28,20"/>
      <path d="M -28,20 Q -22,44 0,46 Q 22,44 28,20 Z"/>
      <!-- Eye -->
      <ellipse cx="0" cy="-10" rx="8" ry="5"/>
      <circle cx="0" cy="-10" r="2.5" fill="${GOLD}" stroke="none" opacity=".5"/>
    `)
  },

  { cat:'divine', type:'svg', label:'Sacred Wings',
    svg: S('-65 -30 130 60','92','56',GOLD,`
      <path d="M 0,-4 Q -18,-22 -42,-20 Q -58,-18 -60,-6 Q -52,2 -36,4 Q -20,6 0,4"/>
      <path d="M 0,-4 Q -14,-10 -28,-8 Q -42,-6 -44,0 Q -36,4 -20,4 Q -8,4 0,4"/>
      <path d="M 0,-4 Q 18,-22 42,-20 Q 58,-18 60,-6 Q 52,2 36,4 Q 20,6 0,4"/>
      <path d="M 0,-4 Q 14,-10 28,-8 Q 42,-6 44,0 Q 36,4 20,4 Q 8,4 0,4"/>
      <circle cx="0" cy="0" r="4"/>
    `)
  },

  { cat:'divine', type:'svg', label:'Star of David',
    svg: S('-50 -50 100 100','82','82',GOLD,`
      <polygon points="${[0,1,2].map(i=>{const a=i*TAU/3-TAU/12;return`${+(Math.cos(a)*40).toFixed(1)},${+(Math.sin(a)*40).toFixed(1)}`}).join(' ')}"/>
      <polygon points="${[0,1,2].map(i=>{const a=i*TAU/3+TAU/12;return`${+(Math.cos(a)*40).toFixed(1)},${+(Math.sin(a)*40).toFixed(1)}`}).join(' ')}"/>
      <circle cx="0" cy="0" r="14" opacity=".4"/>
    `)
  },

  { cat:'divine', type:'svg', label:'Sacred Flame',
    svg: S('-36 -58 72 84','72','84',GOLD,`
      <path d="M 0,24 Q -28,-4 -16,-32 Q -8,-50 0,-54 Q 4,-42 0,-28 Q 12,-38 14,-56 Q 22,-38 20,-10 Q 28,-22 26,-38 Q 36,-14 28,8 Q 20,26 0,24 Z"/>
      <circle cx="0" cy="14" r="6" opacity=".5"/>
    `)
  },

  { cat:'divine', type:'svg', label:'Crescent Moon',
    svg: S('-44 -44 88 88','82','82',GOLD,`
      <path d="M 8,-36 A 36,36 0 1,0 8,36 A 26,26 0 1,1 8,-36 Z"/>
      ${[0,1,2,3,4].map(i=>{const a=i*0.4-0.8,r=46;return`<circle cx="${+(Math.cos(a)*r).toFixed(1)}" cy="${+(Math.sin(a)*r).toFixed(1)}" r="1.2" fill="${GOLD}" stroke="none" opacity=".6"/>`;}).join('')}
    `)
  },

  // ═══════════════════════════════════════════
  // FOREST ART
  // ═══════════════════════════════════════════

  { cat:'forest', type:'svg', label:'Ancient Tree',
    svg: S('-50 -62 100 104','80','92',GREEN,`
      <!-- Trunk -->
      <path d="M -6,40 Q -8,10 -4,-10 Q 0,-22 4,-10 Q 8,10 6,40"/>
      <!-- Root left -->
      <path d="M -6,40 Q -22,48 -34,44" opacity=".7"/>
      <path d="M -6,40 Q -16,52 -20,56" opacity=".5"/>
      <!-- Root right -->
      <path d="M 6,40 Q 22,48 34,44" opacity=".7"/>
      <path d="M 6,40 Q 16,52 20,56" opacity=".5"/>
      <!-- Canopy branches -->
      <path d="M 0,-10 Q -20,-18 -38,-14" opacity=".8"/>
      <path d="M 0,-10 Q 20,-18 38,-14" opacity=".8"/>
      <path d="M -2,-22 Q -26,-30 -42,-28" opacity=".7"/>
      <path d="M 2,-22 Q 26,-30 42,-28" opacity=".7"/>
      <path d="M 0,-32 Q -18,-42 -28,-46" opacity=".65"/>
      <path d="M 0,-32 Q 18,-42 28,-46" opacity=".65"/>
      <path d="M 0,-36 Q -8,-50 -10,-58" opacity=".5"/>
      <path d="M 0,-36 Q 8,-50 10,-58" opacity=".5"/>
      <path d="M 0,-40 Q 0,-52 2,-60" opacity=".5"/>
      <!-- Leaf hints -->
      ${[-38,-14,-28,-46,-10,-58,10,-58,28,-46,38,-14,42,-28,-42,-28].filter((_,i)=>i%2===0).map((x,i)=>{const y=[-38,-14,-28,-46,-10,-58,10,-58,28,-46,38,-14,42,-28,-42,-28][i*2+1]||0;return`<circle cx="${x}" cy="${y}" r="3" opacity=".4"/>`;}).join('')}
    `)
  },

  { cat:'forest', type:'svg', label:'Forest Canopy',
    svg: S('-58 -52 116 80','90','72',GREEN,`
      <!-- Tree 1 center -->
      <line x1="0" y1="26" x2="0" y2="-2"/>
      <polygon points="0,-48 -18,-2 18,-2" opacity=".8"/>
      <polygon points="0,-36 -12,4 12,4" opacity=".6"/>
      <!-- Tree 2 left -->
      <line x1="-34" y1="26" x2="-34" y2="6"/>
      <polygon points="-34,-32 -48,6 -20,6" opacity=".7"/>
      <!-- Tree 3 right -->
      <line x1="34" y1="26" x2="34" y2="6"/>
      <polygon points="34,-32 20,6 48,6" opacity=".7"/>
      <!-- Ground line -->
      <line x1="-56" y1="26" x2="56" y2="26" opacity=".35"/>
    `)
  },

  { cat:'forest', type:'svg', label:'Fern',
    svg: S('-44 -60 88 104','80','96',GREEN,`
      <!-- Spine -->
      <path d="M 0,42 Q 2,-10 -2,-58"/>
      <!-- Left fronds -->
      ${[0,1,2,3,4,5,6,7].map(i=>{
        const y=30-i*12, spread=14+i*2.5;
        return `<path d="M ${(-1+i*0.3).toFixed(1)},${y} Q ${(-spread/2).toFixed(1)},${(y-8).toFixed(1)} ${(-spread).toFixed(1)},${(y-4+i).toFixed(1)}" opacity="${(0.45+i*0.07).toFixed(2)}"/>`;
      }).join('')}
      <!-- Right fronds -->
      ${[0,1,2,3,4,5,6,7].map(i=>{
        const y=26-i*12, spread=12+i*2.5;
        return `<path d="M ${(1-i*0.3).toFixed(1)},${y} Q ${(spread/2).toFixed(1)},${(y-8).toFixed(1)} ${spread.toFixed(1)},${(y-4+i).toFixed(1)}" opacity="${(0.4+i*0.07).toFixed(2)}"/>`;
      }).join('')}
    `)
  },

  { cat:'forest', type:'svg', label:'Sacred Mushroom',
    svg: S('-44 -54 88 88','80','80',GREEN,`
      <!-- Cap -->
      <path d="M -38,4 Q -44,-30 0,-50 Q 44,-30 38,4 Z"/>
      <!-- Gills -->
      ${[-28,-18,-8,0,8,18,28].map(x=>`<line x1="${x}" y1="4" x2="${(x*0.7).toFixed(1)}" y2="-20" opacity=".35"/>`).join('')}
      <!-- Stem -->
      <path d="M -14,4 Q -16,24 -12,32 Q 0,36 12,32 Q 16,24 14,4"/>
      <!-- Spots -->
      <circle cx="-14" cy="-26" r="4" opacity=".4"/>
      <circle cx="14"  cy="-22" r="3" opacity=".4"/>
      <circle cx="2"   cy="-38" r="2.5" opacity=".4"/>
      <circle cx="-26" cy="-10" r="3" opacity=".35"/>
    `)
  },

  { cat:'forest', type:'svg', label:'Root System',
    svg: S('-52 -14 104 80','84','72',GREEN,`
      <!-- Central root -->
      <path d="M 0,-12 Q 2,16 0,64"/>
      <!-- Left roots -->
      <path d="M 0,8  Q -18,14 -36,10 Q -46,10 -50,18" opacity=".8"/>
      <path d="M 0,20 Q -14,28 -28,38 Q -36,44 -40,52" opacity=".7"/>
      <path d="M 0,34 Q -8,42 -16,52" opacity=".55"/>
      <!-- Right roots -->
      <path d="M 0,8  Q 18,14 36,10 Q 46,10 50,18" opacity=".8"/>
      <path d="M 0,20 Q 14,28 28,38 Q 36,44 40,52" opacity=".7"/>
      <path d="M 0,34 Q 8,42 16,52" opacity=".55"/>
      <!-- Sub-roots -->
      <path d="M -36,10 Q -40,22 -44,26" opacity=".45"/>
      <path d="M 36,10  Q 40,22 44,26" opacity=".45"/>
      <!-- Surface line -->
      <line x1="-52" y1="-2" x2="52" y2="-2" opacity=".2"/>
    `)
  },

  { cat:'forest', type:'svg', label:'Seed & Sprout',
    svg: S('-30 -60 60 90','64','88',GREEN,`
      <!-- Seed -->
      <ellipse cx="0" cy="22" rx="14" ry="18"/>
      <!-- Root -->
      <path d="M 0,40 Q 2,52 0,60"/>
      <!-- Sprout stem -->
      <path d="M 0,4 Q -2,-18 0,-56"/>
      <!-- Left leaf -->
      <path d="M -2,-24 Q -22,-36 -24,-48 Q -12,-38 -2,-28" opacity=".8"/>
      <!-- Right leaf -->
      <path d="M 2,-32 Q 22,-42 22,-54 Q 12,-42 2,-36" opacity=".8"/>
      <!-- Tiny bud -->
      <circle cx="0" cy="-56" r="3" opacity=".6"/>
    `)
  },

  { cat:'forest', type:'svg', label:'Leaf',
    svg: S('-38 -58 76 94','72','86',GREEN,`
      <!-- Leaf body -->
      <path d="M 0,34 Q -34,-8 -4,-52 Q 0,-58 4,-52 Q 34,-8 0,34 Z"/>
      <!-- Midrib -->
      <line x1="0" y1="34" x2="0" y2="-52" opacity=".5"/>
      <!-- Lateral veins -->
      ${[0,1,2,3,4,5,6].map(i=>{
        const y=24-i*12, xEnd=14+i*3;
        return `<path d="M 0,${y} Q ${(xEnd*0.5).toFixed(1)},${(y-6).toFixed(1)} ${xEnd},${(y-4).toFixed(1)}" opacity="${(0.3+i*0.04).toFixed(2)}"/>
                <path d="M 0,${y} Q ${(-xEnd*0.5).toFixed(1)},${(y-6).toFixed(1)} ${-xEnd},${(y-4).toFixed(1)}" opacity="${(0.3+i*0.04).toFixed(2)}"/>`;
      }).join('')}
    `)
  },

  { cat:'forest', type:'svg', label:'Full Moon Forest',
    svg: S('-54 -52 108 84','86','76',GREEN,`
      <!-- Moon -->
      <circle cx="0" cy="-22" r="22" opacity=".6"/>
      <!-- Tree silhouettes -->
      <rect x="-46" y="6" width="4" height="30" rx="2" opacity=".8"/>
      <polygon points="-44,-14 -54,6 -34,6" opacity=".75"/>
      <polygon points="-44,-4 -52,14 -36,14" opacity=".55"/>
      <rect x="-14" y="2" width="5" height="34" rx="2" opacity=".8"/>
      <polygon points="-12,-30 -24,2 0,2" opacity=".8"/>
      <polygon points="-12,-18 -22,10 2,10" opacity=".6"/>
      <rect x="10" y="4" width="5" height="32" rx="2" opacity=".8"/>
      <polygon points="12,-28 0,4 24,4" opacity=".8"/>
      <rect x="38" y="8" width="4" height="28" rx="2" opacity=".8"/>
      <polygon points="40,-12 30,8 50,8" opacity=".75"/>
      <!-- Ground -->
      <line x1="-54" y1="36" x2="54" y2="36" opacity=".25"/>
    `)
  },

  // ═══════════════════════════════════════════
  // CONCEPT / TEXT
  // ═══════════════════════════════════════════

  { cat:'core', type:'text', label:'Thesis', serif:true,
    text:'"The money is made owning bottlenecks, not end products."' },

  { cat:'core', type:'text', label:'Consciousness', mono:true,
    text:'LEVEL 32.25\n\nCOSMIC\nTRANSCENDENCE\n\n88.2% ACC' },

  { cat:'core', type:'symbol', label:'Infinity',  symbol:'∞' },
  { cat:'core', type:'symbol', label:'Delta',     symbol:'Δ' },
  { cat:'core', type:'symbol', label:'Phi',       symbol:'φ' },

  { cat:'divine', type:'field', label:'Golden Hour',
    gradient:'radial-gradient(ellipse at 40% 40%, rgba(80,50,10,0.95) 0%, rgba(30,18,4,1) 60%, rgba(8,6,2,1) 100%)' },

  { cat:'forest', type:'field', label:'Deep Forest',
    gradient:'radial-gradient(ellipse at 50% 30%, rgba(10,32,14,0.98) 0%, rgba(4,18,8,1) 60%, rgba(2,8,4,1) 100%)' },
];

// ─── Build cards ──────────────────────────────────────────────────────────────

const stage = document.getElementById('stage');
const cards = [];

function buildCards() {
  CARD_DEFS.forEach((def, i) => {
    const el = document.createElement('div');
    el.className = 'card' + (def.cat === 'divine' ? ' divine' : def.cat === 'forest' ? ' forest' : '');

    const idx = document.createElement('div');
    idx.className = 'card-index';
    idx.textContent = String(i+1).padStart(2,'0');
    el.appendChild(idx);

    if (def.cat !== 'core') {
      const tag = document.createElement('div');
      tag.className = 'card-tag';
      tag.textContent = def.cat.toUpperCase();
      el.appendChild(tag);
    }

    if (def.type === 'svg') {
      el.innerHTML += def.svg;
    } else if (def.type === 'text') {
      const t = document.createElement('div');
      t.className = 'card-text' + (def.serif?' serif':'') + (def.mono?' mono':'');
      t.innerHTML = def.text.replace(/\n/g,'<br>');
      el.appendChild(t);
    } else if (def.type === 'symbol') {
      const s = document.createElement('div');
      s.className = 'card-symbol';
      s.textContent = def.symbol;
      el.appendChild(s);
    } else if (def.type === 'field') {
      const f = document.createElement('div');
      f.className = 'card-field';
      f.style.background = def.gradient;
      el.appendChild(f);
    }

    const lbl = document.createElement('div');
    lbl.className = 'card-label';
    lbl.textContent = def.label.toUpperCase();
    el.appendChild(lbl);

    stage.appendChild(el);

    const a = (i/CARD_DEFS.length)*TAU;
    const r = Math.min(W,H)*0.26;
    const card = {
      el, def, i,
      x: cx+Math.cos(a)*r, y: cy+Math.sin(a)*r,
      hx:cx+Math.cos(a)*r, hy:cy+Math.sin(a)*r,
      vx:0, vy:0, rotX:0, rotY:0, rotZ:0, scale:1,
      depth: 0.75+Math.random()*0.5,
      phase: Math.random()*TAU,
      floatAmp: 3+Math.random()*6,
      floatFreq: 0.003+Math.random()*0.004,
    };
    cards.push(card);
  });
}

// ─── Arrangements ─────────────────────────────────────────────────────────────

const ARRS = {
  drift(cards,t) {
    cards.forEach((c,i) => {
      const a=(i/cards.length)*TAU+t*0.0001;
      const r=Math.min(W,H)*0.26;
      c.hx=cx+Math.cos(a)*r; c.hy=cy+Math.sin(a)*r;
    });
  },
  grid(cards) {
    const cols=Math.ceil(Math.sqrt(cards.length));
    const pw=178, ph=248;
    const ox=-(cols-1)*pw/2, oy=-(Math.ceil(cards.length/cols)-1)*ph/2;
    cards.forEach((c,i) => { c.hx=cx+ox+(i%cols)*pw; c.hy=cy+oy+Math.floor(i/cols)*ph; c.rotZ=0; });
  },
  divine(cards) {
    const divs=cards.filter(c=>c.def.cat==='divine');
    const rest=cards.filter(c=>c.def.cat!=='divine');
    const n=divs.length;
    divs.forEach((c,i) => {
      const a=i*TAU/n-TAU/4;
      c.hx=cx+Math.cos(a)*Math.min(W,H)*0.28;
      c.hy=cy+Math.sin(a)*Math.min(W,H)*0.28;
      c.rotZ=0;
    });
    rest.forEach((c,i) => {
      const a=i*TAU/rest.length+Math.PI;
      c.hx=cx+Math.cos(a)*Math.min(W,H)*0.16;
      c.hy=cy+Math.sin(a)*Math.min(W,H)*0.16;
      c.rotZ=0;
    });
  },
  forest(cards) {
    const fors=cards.filter(c=>c.def.cat==='forest');
    const rest=cards.filter(c=>c.def.cat!=='forest');
    const n=fors.length;
    fors.forEach((c,i) => {
      const a=i*TAU/n-TAU/4;
      c.hx=cx+Math.cos(a)*Math.min(W,H)*0.29;
      c.hy=cy+Math.sin(a)*Math.min(W,H)*0.29;
      c.rotZ=0;
    });
    rest.forEach((c,i) => {
      c.hx=cx+(i-rest.length/2)*60;
      c.hy=cy;
      c.rotZ=0;
    });
  },
  fan(cards) {
    const n=cards.length, fw=Math.min(W*0.88,n*48);
    cards.forEach((c,i) => {
      const p=n>1?i/(n-1):0.5;
      c.hx=cx-fw/2+p*fw;
      c.hy=cy*1.1+Math.sin(p*Math.PI)*-H*0.15;
      c.rotZ=(p-0.5)*28;
    });
  },
  stack(cards) {
    cards.forEach((c,i) => {
      c.hx=cx+(i-cards.length/2)*2.2;
      c.hy=cy+(i-cards.length/2)*1.2;
      c.rotZ=(i-cards.length/2)*3;
    });
  },
  spiral(cards) {
    cards.forEach((c,i) => {
      const a=i*0.72*TAU, r=18+i*16;
      c.hx=cx+Math.cos(a)*r; c.hy=cy+Math.sin(a)*r; c.rotZ=0;
    });
  },
};
const ARR_KEYS=Object.keys(ARRS);

function setArr(name) {
  if (!ARRS[name]) return;
  currentArr=name; arrIdx=ARR_KEYS.indexOf(name);
  if (['grid','drift','spiral','divine','forest'].includes(name))
    cards.forEach(c=>{ c.rotZ=0; });
  document.getElementById('hud-l').textContent=name.toUpperCase();
}

// ─── Physics tick ─────────────────────────────────────────────────────────────

const K=0.052, DMP=0.79;

function tick(t) {
  ARRS[currentArr](cards,t);
  const mx=ptr.x, my=ptr.y, spd=ptr.speed;
  cards.forEach(c => {
    if (c===grabbedCard) {
      c.vx=(mx-c.x)*0.32; c.vy=(my-c.y)*0.32;
      c.x+=c.vx; c.y+=c.vy;
      c.rotX*=0.85; c.rotY*=0.85;
      c.scale=c.scale*0.9+1.09*0.1;
    } else {
      c.vx=(c.vx+(c.hx-c.x)*K*(0.65+0.55*c.depth))*DMP;
      c.vy=(c.vy+(c.hy-c.y)*K*(0.65+0.55*c.depth))*DMP;
      const dx=mx-c.x, dy=my-c.y, dist=Math.hypot(dx,dy);
      const infl=Math.max(0,1-dist/210);
      if (pullMode&&infl>0.1) { c.vx+=dx*0.034*infl; c.vy+=dy*0.034*infl; }
      else if (spd>3.5&&infl>0.04) {
        const ang=Math.atan2(dy,dx), push=spd*0.21*infl;
        c.vx-=Math.cos(ang)*push; c.vy-=Math.sin(ang)*push;
      }
      c.x+=c.vx; c.y+=c.vy;
      const tilt=Math.min(infl*15,10);
      c.rotX=c.rotX*0.88+(-((my-cy)/(H/2))*tilt)*0.12;
      c.rotY=c.rotY*0.88+(((mx-cx)/(W/2))*tilt)*0.12;
      c.scale=c.scale*0.93+(1+infl*0.055)*0.07;
    }
    const fx=Math.cos(t*c.floatFreq+c.phase)*c.floatAmp*0.4;
    const fy=Math.sin(t*c.floatFreq*1.3+c.phase)*c.floatAmp;
    c.el.classList.toggle('hovered',Math.hypot(mx-c.x,my-c.y)<210&&c!==grabbedCard);
    c.el.classList.toggle('grabbed',c===grabbedCard);
    c.el.style.transform=
      `translate(calc(${c.x+fx}px - 50%),calc(${c.y+fy}px - 50%))
       rotateX(${c.rotX.toFixed(2)}deg) rotateY(${c.rotY.toFixed(2)}deg)
       rotateZ(${c.rotZ.toFixed(2)}deg) scale(${c.scale.toFixed(4)})`;
    c.el.style.opacity=(0.48+c.depth*0.52).toFixed(2);
    c.el.style.zIndex=Math.round(c.depth*10+(c===grabbedCard?200:0));
  });
}

function nearestCard(x,y,maxD=170) {
  let best=null,bestD=maxD;
  cards.forEach(c=>{const d=Math.hypot(c.x-x,c.y-y);if(d<bestD){bestD=d;best=c;}});
  return best;
}

function scatter() {
  cards.forEach(c=>{
    const ang=Math.atan2(c.y-ptr.y,c.x-ptr.x);
    const f=6+Math.random()*10;
    c.vx+=Math.cos(ang)*f; c.vy+=Math.sin(ang)*f;
  });
}

// ─── Touch badge ──────────────────────────────────────────────────────────────

let badgeTimer=null;
function showBadge(text) {
  const el=document.getElementById('touch-badge');
  el.textContent=text; el.style.color='rgba(255,255,255,0.55)';
  clearTimeout(badgeTimer);
  badgeTimer=setTimeout(()=>{el.style.color='rgba(255,255,255,0)';},900);
}

// ─── Touch mappings (from hand_tracking.py) ───────────────────────────────────
// Translated from TOUCH_MAPPINGS — finger pair → action

const TOUCH_COOLDOWN = {};
const TOUCH_COOLDOWN_FRAMES = 22;
const TOUCH_STATE = {};

const TOUCH_MAP = {
  'thumb+index':  { action:'grab',      label:'GRAB' },
  'thumb+middle': { action:'scatter',   label:'SCATTER' },
  'thumb+ring':   { action:'divine',    label:'DIVINE LAYOUT' },
  'thumb+pinky':  { action:'forest',    label:'FOREST LAYOUT' },
  'index+middle': { action:'grid',      label:'GRID' },
  'index+ring':   { action:'fan',       label:'FAN' },
  'index+pinky':  { action:'spiral',    label:'SPIRAL' },
  'middle+ring':  { action:'stack',     label:'STACK' },
  'ring+pinky':   { action:'drift',     label:'DRIFT' },
};

function checkTouch(lm, f1, f2, i1, i2, key) {
  const dist=Math.hypot(lm[i1].x-lm[i2].x, lm[i1].y-lm[i2].y);
  const touching=dist<0.065;
  const wasTouching=TOUCH_STATE[key]||false;

  if (touching&&!wasTouching&&(!TOUCH_COOLDOWN[key]||TOUCH_COOLDOWN[key]<=0)) {
    TOUCH_STATE[key]=true;
    TOUCH_COOLDOWN[key]=TOUCH_COOLDOWN_FRAMES;
    return true;
  }
  if (!touching&&wasTouching) TOUCH_STATE[key]=false;
  if (TOUCH_COOLDOWN[key]>0) TOUCH_COOLDOWN[key]--;
  return false;
}

function executeTouchAction(action, lm) {
  const ix=(1-lm[8].x)*W, iy=lm[8].y*H;
  const map = {
    grab:    ()=>{ const c=nearestCard(ix,iy,200); if(c){grabbedCard=c;pullMode=true;} },
    scatter: ()=>{ scatter(); grabbedCard=null; pullMode=false; },
    divine:  ()=>{ setArr('divine'); },
    forest:  ()=>{ setArr('forest'); },
    grid:    ()=>{ setArr('grid'); },
    fan:     ()=>{ setArr('fan'); },
    spiral:  ()=>{ setArr('spiral'); },
    stack:   ()=>{ setArr('stack'); },
    drift:   ()=>{ setArr('drift'); },
  };
  if (map[action]) map[action]();
}

// ─── Hand tracking ────────────────────────────────────────────────────────────

const videoEl=document.getElementById('cam-video');
const camCv=document.getElementById('cam-canvas');
const camCtx=camCv.getContext('2d');

const CONN=[[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[0,9],[9,10],[10,11],[11,12],[0,13],[13,14],[14,15],[15,16],[0,17],[17,18],[18,19],[19,20],[5,9],[9,13],[13,17]];

// Gesture classification
function classifyGesture(lm) {
  const ext=(t,m)=>lm[t].y<lm[m].y-0.04;
  const ie=ext(8,5),me=ext(12,9),re=ext(16,13),pe=ext(20,17);
  const sp=[ie,me,re,pe].filter(Boolean).length;
  const pd=Math.hypot(lm[4].x-lm[8].x,lm[4].y-lm[8].y);
  if (pd<0.065) return sp>=3?'ok':'pinch';
  if (ie&&pe&&!me&&!re) return 'rock';
  if (ie&&me&&!re&&!pe) return 'peace';
  if (ie&&!me&&!re&&!pe) return 'point';
  if (sp===4) return 'open';
  if (sp===0) return 'fist';
  return 'none';
}

let gestureHold=0, lastGesture='none', committedGesture='none';

function onHandResults(results) {
  const cw=camCv.width=videoEl.videoWidth||320;
  const ch=camCv.height=videoEl.videoHeight||240;
  camCtx.clearRect(0,0,cw,ch);

  if (!results.multiHandLandmarks||!results.multiHandLandmarks.length) {
    handActive=false;
    document.getElementById('hand-ptr').style.display='none';
    document.getElementById('cam-label').textContent='○ SEARCHING';
    if (!pullMode) grabbedCard=null;
    return;
  }

  handActive=true;
  document.getElementById('cam-label').textContent='● HAND TRACKING';

  const lm=results.multiHandLandmarks[0];

  // Draw skeleton on pip
  CONN.forEach(([a,b])=>{
    camCtx.beginPath();
    camCtx.moveTo(lm[a].x*cw,lm[a].y*ch);
    camCtx.lineTo(lm[b].x*cw,lm[b].y*ch);
    camCtx.strokeStyle='rgba(140,210,255,0.5)';
    camCtx.lineWidth=1.1; camCtx.stroke();
  });
  [4,8,12,16,20].forEach(i=>{
    camCtx.beginPath();
    camCtx.arc(lm[i].x*cw,lm[i].y*ch,2.8,0,TAU);
    camCtx.fillStyle='rgba(200,240,255,0.9)'; camCtx.fill();
  });
  camCtx.beginPath();
  camCtx.arc(lm[0].x*cw,lm[0].y*ch,3.5,0,TAU);
  camCtx.fillStyle='rgba(100,180,255,0.8)'; camCtx.fill();

  // Map index tip → screen (mirror x)
  const ix=(1-lm[8].x)*W, iy=lm[8].y*H;
  ptr.px=ptr.x; ptr.py=ptr.y;
  ptr.x=ix; ptr.y=iy;
  ptr.vx=ptr.x-ptr.px; ptr.vy=ptr.y-ptr.py;
  ptr.speed=Math.hypot(ptr.vx,ptr.vy);

  const hp=document.getElementById('hand-ptr');
  hp.style.display='block'; hp.style.left=ix+'px'; hp.style.top=iy+'px';

  // Gesture
  const g=classifyGesture(lm);
  document.getElementById('hud-g').textContent=g.toUpperCase();
  if (g===lastGesture) gestureHold++; else { gestureHold=0; lastGesture=g; }
  if (gestureHold===5&&g!==committedGesture) {
    committedGesture=g;
    if (g!=='pinch'&&g!=='ok') { grabbedCard=null; pullMode=false; }
  }

  // ── Full touch-pair detection (from hand_tracking.py TOUCH_MAPPINGS) ──
  const PAIRS = [
    ['thumb','index',  4, 8],
    ['thumb','middle', 4,12],
    ['thumb','ring',   4,16],
    ['thumb','pinky',  4,20],
    ['index','middle', 8,12],
    ['index','ring',   8,16],
    ['index','pinky',  8,20],
    ['middle','ring', 12,16],
    ['ring','pinky',  16,20],
  ];
  PAIRS.forEach(([f1,f2,i1,i2])=>{
    const key=f1+'+'+f2;
    const fired=checkTouch(lm,f1,f2,i1,i2,key);
    if (fired&&TOUCH_MAP[key]) {
      const m=TOUCH_MAP[key];
      showBadge(m.label);
      document.getElementById('hud-t').textContent=m.label;
      executeTouchAction(m.action,lm);
    }
  });

  // Release grab if not pinching
  if (!TOUCH_STATE['thumb+index']) { pullMode=false; grabbedCard=null; }
}

// ─── Camera start ─────────────────────────────────────────────────────────────

function startCamera() {
  const hands=new Hands({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`});
  hands.setOptions({maxNumHands:1,modelComplexity:1,minDetectionConfidence:0.72,minTrackingConfidence:0.6});
  hands.onResults(onHandResults);
  const cam=new Camera(videoEl,{
    onFrame:async()=>{
      camCv.width=videoEl.videoWidth||320;
      camCv.height=videoEl.videoHeight||240;
      await hands.send({image:videoEl});
    },width:640,height:480,
  });
  cam.start().then(()=>{
    document.getElementById('cam-wrap').style.opacity='0.9';
    document.getElementById('perm').style.opacity='0';
    setTimeout(()=>document.getElementById('perm').style.display='none',600);
  }).catch(skipCamera);
}
function skipCamera() {
  document.getElementById('perm').style.opacity='0';
  setTimeout(()=>document.getElementById('perm').style.display='none',600);
}

document.getElementById('perm-btn').addEventListener('click',startCamera);
document.getElementById('skip-btn').addEventListener('click',skipCamera);

// ─── Cursor ───────────────────────────────────────────────────────────────────

const curEl=document.getElementById('cursor'), ringEl=document.getElementById('cursor-ring');
let curX=cx,curY=cy,rX=cx,rY=cy;
function moveCursor() {
  curX+=(ptr.x-curX)*0.9; curY+=(ptr.y-curY)*0.9;
  rX+=(ptr.x-rX)*0.16; rY+=(ptr.y-rY)*0.16;
  curEl.style.left=curX+'px'; curEl.style.top=curY+'px';
  ringEl.style.left=rX+'px'; ringEl.style.top=rY+'px';
  ringEl.style.width=ringEl.style.height=pullMode?'58px':ptr.speed>4?'18px':'34px';
  ringEl.style.borderColor=pullMode?'rgba(140,210,255,0.4)':'rgba(255,255,255,0.2)';
}

// ─── Mouse fallback ───────────────────────────────────────────────────────────

window.addEventListener('mousemove',e=>{
  if(handActive)return;
  ptr.px=ptr.x;ptr.py=ptr.y;ptr.x=e.clientX;ptr.y=e.clientY;
  ptr.vx=ptr.x-ptr.px;ptr.vy=ptr.y-ptr.py;ptr.speed=Math.hypot(ptr.vx,ptr.vy);
});
window.addEventListener('mousedown',()=>{if(!handActive)pullMode=true;});
window.addEventListener('mouseup',()=>{if(!handActive){pullMode=false;grabbedCard=null;}});
window.addEventListener('click',e=>{if(!handActive&&(e.target===document.body||e.target===stage))scatter();});
window.addEventListener('dblclick',()=>{arrIdx=(arrIdx+1)%ARR_KEYS.length;setArr(ARR_KEYS[arrIdx]);});
window.addEventListener('keydown',e=>{
  const m={'1':'drift','2':'grid','3':'fan','4':'stack','5':'spiral','6':'divine','7':'forest'};
  if(m[e.key])setArr(m[e.key]);
  if(e.key===' '){e.preventDefault();scatter();}
});
window.addEventListener('resize',()=>{W=innerWidth;H=innerHeight;cx=W/2;cy=H/2;});
window.addEventListener('touchmove',e=>{
  e.preventDefault();
  const t=e.touches[0];if(handActive)return;
  ptr.px=ptr.x;ptr.py=ptr.y;ptr.x=t.clientX;ptr.y=t.clientY;
  ptr.vx=ptr.x-ptr.px;ptr.vy=ptr.y-ptr.py;ptr.speed=Math.hypot(ptr.vx,ptr.vy);
},{passive:false});

// ─── Main loop ────────────────────────────────────────────────────────────────

function loop(ts) {
  requestAnimationFrame(loop);
  loopT=ts; frame++;
  tick(ts);
  moveCursor();
}

buildCards();
setArr('drift');
requestAnimationFrame(loop);
</script>
