<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eudaimon — Garden Cards</title>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#3d5c28; overflow:hidden; font-family:'Georgia',serif; cursor:none; user-select:none; }

#bg    { position:fixed; inset:0; z-index:0; }
#stage { position:fixed; inset:0; z-index:10; }

/* ── Glass cards ── */
.card {
  position:absolute; width:120px; height:168px;
  border-radius:12px;
  background:rgba(255,252,240,0.062);
  backdrop-filter:blur(24px) saturate(200%) brightness(1.06);
  -webkit-backdrop-filter:blur(24px) saturate(200%) brightness(1.06);
  border:0.7px solid rgba(255,255,255,0.17);
  box-shadow:
    0 6px 28px rgba(0,0,0,0.16),
    inset 0 1px 0 rgba(255,255,255,0.20),
    inset 0 -1px 0 rgba(0,0,0,0.06);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  pointer-events:none; will-change:transform; overflow:hidden;
  transition:border-color .4s, box-shadow .45s;
}
.card::before {
  content:''; position:absolute; top:0; left:14px; right:14px; height:0.7px;
  background:linear-gradient(90deg, transparent, rgba(255,255,255,0.22), transparent);
  pointer-events:none;
}
.card.divine  { border-color:rgba(255,218,110,0.26); background:rgba(255,248,215,0.07); }
.card.divine::before { background:linear-gradient(90deg, transparent, rgba(255,210,80,0.44), transparent); }
.card.forest  { border-color:rgba(125,215,115,0.24); background:rgba(215,255,215,0.06); }
.card.forest::before { background:linear-gradient(90deg, transparent, rgba(105,210,95,0.38), transparent); }
.card.garden  { border-color:rgba(255,192,172,0.24); background:rgba(255,238,228,0.07); }
.card.garden::before { background:linear-gradient(90deg, transparent, rgba(255,170,148,0.38), transparent); }

.card-art { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }
.card-content {
  position:relative; z-index:2;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:7px;
  width:100%; padding:0 11px;
}
.card-label {
  position:absolute; bottom:10px; left:0; right:0; text-align:center;
  font-family:'Courier New',monospace; font-size:5.8px; letter-spacing:.26em;
  color:rgba(255,255,255,0.30); text-transform:uppercase; z-index:3;
  text-shadow:0 1px 3px rgba(0,0,0,0.4);
}
.card-index {
  position:absolute; top:9px; left:10px; z-index:3;
  font-family:'Courier New',monospace; font-size:5.8px; letter-spacing:.10em;
  color:rgba(255,255,255,0.15);
}
.card-tag {
  position:absolute; top:9px; right:10px; z-index:3;
  font-family:'Courier New',monospace; font-size:5.2px; letter-spacing:.12em;
  color:rgba(255,255,255,0.12);
}
.card-text {
  color:rgba(255,255,255,0.80); font-size:9px; line-height:1.62;
  text-align:center; letter-spacing:.03em;
  text-shadow:0 1px 5px rgba(0,0,0,0.5);
}
.card-text.serif { font-style:italic; font-size:8.5px; }
.card-text.mono  { font-family:'Courier New',monospace; font-size:7px; letter-spacing:.09em; }
.card-symbol { font-size:32px; color:rgba(255,255,255,0.70); line-height:1; text-shadow:0 2px 10px rgba(0,0,0,0.4); }

/* ── Pip cam ── */
#cam-wrap   { position:fixed; bottom:22px; right:22px; width:186px; height:140px; border-radius:12px; overflow:hidden; border:1px solid rgba(255,255,255,0.18); z-index:200; backdrop-filter:blur(4px); }
#cam-video  { position:absolute; width:100%; height:100%; object-fit:cover; transform:scaleX(-1); opacity:0.55; }
#cam-canvas { position:absolute; width:100%; height:100%; transform:scaleX(-1); }
#cam-label  { position:absolute; bottom:7px; left:9px; font-family:'Courier New',monospace; font-size:7px; letter-spacing:.14em; color:rgba(255,255,255,0.45); }

/* ── Gesture glyph (replaces cursor) ── */
#gest-glyph {
  position:fixed; pointer-events:none; z-index:150;
  bottom:172px; right:22px; width:186px;
  font-family:'Courier New',monospace; font-size:7px; letter-spacing:.22em;
  color:rgba(255,255,255,0.28); text-align:center;
  text-shadow:0 1px 4px rgba(0,0,0,0.4);
  transition:color .3s;
}

/* ── UI ── */
#wordmark { position:fixed; top:24px; left:24px; pointer-events:none; z-index:100; }
#wordmark h1 { font-size:10px; font-weight:400; letter-spacing:.34em; color:rgba(255,255,255,0.55); font-family:'Courier New',monospace; text-shadow:0 1px 6px rgba(0,0,0,0.3); }
#wordmark p  { font-size:7px; letter-spacing:.2em; color:rgba(255,255,255,0.25); margin-top:4px; font-family:'Courier New',monospace; }

#hud { position:fixed; top:24px; right:24px; text-align:right; pointer-events:none; z-index:100; font-family:'Courier New',monospace; font-size:7.5px; letter-spacing:.16em; line-height:2.1; color:rgba(255,255,255,0.25); text-shadow:0 1px 4px rgba(0,0,0,0.3); }
#hud .v { color:rgba(255,255,255,0.6); }

#touch-flash { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); font-family:'Courier New',monospace; font-size:9px; letter-spacing:.24em; color:rgba(255,255,255,0); pointer-events:none; z-index:300; text-shadow:0 2px 8px rgba(0,0,0,0.4); transition:color .12s,opacity .5s; }

/* ── Permission ── */
#perm { position:fixed; inset:0; background:rgba(30,48,18,0.9); backdrop-filter:blur(12px); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; z-index:1000; transition:opacity .5s; }
#perm h2 { font-family:'Courier New',monospace; font-size:10px; letter-spacing:.34em; color:rgba(255,255,255,0.6); font-weight:400; }
#perm p  { font-family:'Courier New',monospace; font-size:8px; letter-spacing:.18em; color:rgba(255,255,255,0.28); }
.perm-btn { background:none; border:1px solid rgba(255,255,255,0.2); color:rgba(255,255,255,0.5); font-family:'Courier New',monospace; font-size:8px; letter-spacing:.2em; padding:10px 26px; border-radius:4px; cursor:pointer; transition:all .25s; }
.perm-btn:hover { border-color:rgba(180,230,140,0.5); color:rgba(200,255,180,0.8); }
.perm-skip { background:none; border:none; cursor:pointer; font-family:'Courier New',monospace; font-size:7px; letter-spacing:.14em; color:rgba(255,255,255,0.18); }
.perm-skip:hover { color:rgba(255,255,255,0.38); }

/* ── Gesture hint bar (bottom left) ── */
#hints {
  position:fixed; bottom:24px; left:24px; pointer-events:none; z-index:100;
  font-family:'Courier New',monospace; font-size:6.5px; letter-spacing:.14em;
  line-height:2.0; color:rgba(255,255,255,0.18); text-shadow:0 1px 3px rgba(0,0,0,0.4);
}
</style>
</head>
<body>

<div id="perm">
  <h2>EUDAIMON</h2>
  <p>Enable camera for hand tracking</p>
  <button class="perm-btn" id="perm-btn">ENABLE CAMERA</button>
  <button class="perm-skip" id="skip-btn">Enter without camera</button>
</div>

<canvas id="bg"></canvas>
<div id="touch-flash"></div>

<div id="wordmark"><h1>Eudaimon</h1><p>Garden · 2026</p></div>
<div id="hud">
  GESTURE &nbsp;<span class="v" id="hud-g">—</span><br>
  ORBIT &nbsp;&nbsp;&nbsp;<span class="v" id="hud-r">0°</span><br>
  LAYOUT &nbsp;&nbsp;<span class="v" id="hud-l">DRIFT</span>
</div>

<div id="cam-wrap" style="opacity:0">
  <video id="cam-video" autoplay muted playsinline></video>
  <canvas id="cam-canvas"></canvas>
  <div id="cam-label">○ SEARCHING</div>
</div>
<div id="gest-glyph">—</div>

<div id="hints">
  ✋ OPEN PALM — drift<br>
  ✊ FIST — stack<br>
  ✌ PEACE — fan<br>
  🤘 ROCK — divine<br>
  ☝ POINT — spiral<br>
  🤏 PINCH — grid<br>
  ↔ SWIPE — cycle layout<br>
  ↻ ROTATE WRIST — orbit
</div>

<div id="stage"></div>
<canvas id="intro" style="position:fixed;inset:0;z-index:600;pointer-events:none;"></canvas>

<script>
const TAU = Math.PI * 2;
let W = innerWidth, H = innerHeight, cx = W/2, cy = H/2;

// ─── Garden background ────────────────────────────────────────────────────────

const bgCv  = document.getElementById('bg');
const bgCtx = bgCv.getContext('2d');

const BOKEH = Array.from({length:28}, () => ({
  x: Math.random(), y: Math.random(),
  r: 24 + Math.random() * 70,
  a: 0.025 + Math.random() * 0.065,
  spd: 0.00003 + Math.random() * 0.00009,
  ph: Math.random() * TAU,
  hue: Math.random() < 0.5 ? 50 + Math.random()*30 : 100 + Math.random()*40,
}));

const PETALS = Array.from({length:22}, () => ({
  x: Math.random(), y: Math.random(),
  vx: (-0.4 + Math.random()*0.8)*0.0003,
  vy: (0.15 + Math.random()*0.5)*0.0003,
  rot: Math.random()*TAU,
  rs: (Math.random()-0.5)*0.04,
  w: 0.005 + Math.random()*0.01,
  h: 0.002 + Math.random()*0.006,
  a: 0.35 + Math.random()*0.45,
  hue: Math.random()<0.6 ? 340+Math.random()*25 : 30+Math.random()*20,
}));

const TREES = Array.from({length:14}, (_,i) => ({
  x: (i/14)+(Math.random()*0.06-0.03),
  h: 0.12+Math.random()*0.10,
  w: 0.018+Math.random()*0.022,
}));

function drawGarden(t) {
  bgCtx.clearRect(0, 0, W, H);

  const sky = bgCtx.createLinearGradient(0, 0, 0, H*0.52);
  sky.addColorStop(0,    '#f2d98a');
  sky.addColorStop(0.25, '#ddc878');
  sky.addColorStop(0.6,  '#b8cf8a');
  sky.addColorStop(1,    '#7aaa62');
  bgCtx.fillStyle = sky; bgCtx.fillRect(0, 0, W, H*0.52);

  const sunX = W*0.68, sunY = H*0.11;
  const sg = bgCtx.createRadialGradient(sunX, sunY, 0, sunX, sunY, H*0.38);
  sg.addColorStop(0,    'rgba(255,240,170,0.80)');
  sg.addColorStop(0.22, 'rgba(255,215,105,0.32)');
  sg.addColorStop(1,    'rgba(255,190,60,0)');
  bgCtx.fillStyle = sg; bgCtx.fillRect(0, 0, W, H);

  bgCtx.save();
  for (let r = 0; r < 14; r++) {
    const a   = (r/14)*TAU + Math.sin(t*0.00012+r*0.9)*0.018;
    const len = W*0.62, spread = 0.016+(r%3===0?0.012:0);
    const op  = r%3===0?0.058:r%3===1?0.034:0.020;
    const rg  = bgCtx.createLinearGradient(sunX, sunY, sunX+Math.cos(a)*len, sunY+Math.sin(a)*len);
    rg.addColorStop(0,    `rgba(255,244,190,${op*2.6})`);
    rg.addColorStop(0.18, `rgba(255,238,170,${op*1.4})`);
    rg.addColorStop(1,    'rgba(255,225,140,0)');
    bgCtx.beginPath();
    bgCtx.moveTo(sunX, sunY);
    bgCtx.lineTo(sunX+Math.cos(a-spread)*len, sunY+Math.sin(a-spread)*len);
    bgCtx.lineTo(sunX+Math.cos(a+spread)*len, sunY+Math.sin(a+spread)*len);
    bgCtx.closePath();
    bgCtx.fillStyle = rg; bgCtx.fill();
  }
  bgCtx.restore();

  const gnd = bgCtx.createLinearGradient(0, H*0.48, 0, H);
  gnd.addColorStop(0,    '#5c9044');
  gnd.addColorStop(0.2,  '#4a7835');
  gnd.addColorStop(0.55, '#386028');
  gnd.addColorStop(1,    '#24401a');
  bgCtx.fillStyle = gnd; bgCtx.fillRect(0, H*0.48, W, H*0.52);

  const mist = bgCtx.createLinearGradient(0, H*0.43, 0, H*0.56);
  mist.addColorStop(0,    'rgba(218,232,200,0)');
  mist.addColorStop(0.45, 'rgba(224,236,210,0.42)');
  mist.addColorStop(1,    'rgba(200,220,195,0)');
  bgCtx.fillStyle = mist; bgCtx.fillRect(0, H*0.43, W, H*0.13);

  TREES.forEach(tr => {
    const tx=tr.x*W, ty=H*0.48, tw=tr.w*W, th=tr.h*H;
    bgCtx.beginPath();
    bgCtx.moveTo(tx, ty);
    bgCtx.lineTo(tx-tw*0.5, ty-th*0.55);
    bgCtx.quadraticCurveTo(tx, ty-th, tx+tw*0.5, ty-th*0.55);
    bgCtx.closePath();
    bgCtx.fillStyle='rgba(26,52,18,0.55)'; bgCtx.fill();
    bgCtx.fillStyle='rgba(26,52,18,0.35)';
    bgCtx.fillRect(tx-tw*0.12, ty-th*0.55, tw*0.24, th*0.55);
  });

  BOKEH.forEach(b => {
    const bx=(b.x+Math.sin(t*b.spd+b.ph)*0.04)*W;
    const by=(b.y+Math.cos(t*b.spd*0.7+b.ph)*0.025)*H;
    const gr=bgCtx.createRadialGradient(bx,by,0,bx,by,b.r);
    gr.addColorStop(0, `hsla(${b.hue},65%,84%,${b.a})`);
    gr.addColorStop(1, `hsla(${b.hue},55%,74%,0)`);
    bgCtx.fillStyle=gr;
    bgCtx.beginPath(); bgCtx.arc(bx,by,b.r,0,TAU); bgCtx.fill();
  });

  PETALS.forEach(p => {
    p.x=(p.x+p.vx+1)%1; p.y=(p.y+p.vy+1)%1; p.rot+=p.rs;
    bgCtx.save();
    bgCtx.translate(p.x*W, p.y*H); bgCtx.rotate(p.rot);
    bgCtx.beginPath(); bgCtx.ellipse(0,0,p.w*W,p.h*W,0,0,TAU);
    bgCtx.fillStyle=`hsla(${p.hue},55%,84%,${p.a})`; bgCtx.fill();
    bgCtx.restore();
  });

  for (let i=0;i<80;i++) {
    const gx=(i/80)*W+Math.sin(i*1.7)*18, gy=H*0.5+(i%3)*4;
    const gh=18+Math.sin(i*2.3+t*0.0008)*8;
    bgCtx.beginPath();
    bgCtx.moveTo(gx, gy);
    bgCtx.quadraticCurveTo(gx+Math.sin(i+t*0.0005)*6, gy-gh*0.6, gx+Math.sin(i*0.8)*3, gy-gh);
    bgCtx.strokeStyle=`rgba(38,72,22,${0.35+(i%4)*0.1})`; bgCtx.lineWidth=1.2; bgCtx.stroke();
  }

  [[0.08,0.52],[0.18,0.54],[0.32,0.51],[0.44,0.53],[0.56,0.52],[0.7,0.54],[0.82,0.51],[0.92,0.53]].forEach(([fx,fy],i) => {
    const flx=fx*W+Math.sin(t*0.0004+i)*3, fly=fy*H, r=3.5;
    const pc=i%2===0?'rgba(255,200,210,0.7)':'rgba(255,240,160,0.7)';
    for(let k=0;k<6;k++){const a=k*TAU/6;bgCtx.beginPath();bgCtx.ellipse(flx+Math.cos(a)*r*1.8,fly+Math.sin(a)*r*1.8,r,r*0.55,a,0,TAU);bgCtx.fillStyle=pc;bgCtx.fill();}
    bgCtx.beginPath();bgCtx.arc(flx,fly,r*0.7,0,TAU);bgCtx.fillStyle='rgba(255,220,100,0.85)';bgCtx.fill();
  });

  const vig=bgCtx.createRadialGradient(W*0.5,H*0.56,Math.min(W,H)*0.22,W*0.5,H*0.56,Math.max(W,H)*0.74);
  vig.addColorStop(0,'rgba(0,0,0,0)'); vig.addColorStop(1,'rgba(8,18,4,0.42)');
  bgCtx.fillStyle=vig; bgCtx.fillRect(0,0,W,H);
}

// ─── SVG helpers ─────────────────────────────────────────────────────────────

const GOLD  = 'rgba(255,208,100,0.62)';
const IVRY  = 'rgba(255,252,230,0.55)';
const GREEN = 'rgba(130,210,105,0.58)';
const ROSE  = 'rgba(255,180,160,0.6)';
const SKY   = 'rgba(180,220,255,0.55)';
const cos   = (a) => Math.cos(a).toFixed(2);
const sin   = (a) => Math.sin(a).toFixed(2);

function S(vb, w, h, stroke, body) {
  return `<svg viewBox="${vb}" width="${w}" height="${h}" fill="none" stroke="${stroke}" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round">${body}</svg>`;
}

// ─── Card definitions (12 cards, each with unique art) ────────────────────────

const CARDS = [

  // ═══ DIVINE ═══════════════════════════════════════════════════════════════

  { cat:'divine', label:'Eye of Providence',
    art: S('-52 -58 104 108', 82, 88, GOLD, `
      <circle cx="0" cy="-2" r="50" opacity=".10"/>
      <polygon points="0,-52 -44,36 44,36" opacity=".82"/>
      <ellipse cx="0" cy="8" rx="15" ry="9"/>
      <circle cx="0" cy="8" r="5.5" fill="${GOLD}" stroke="none" opacity=".36"/>
      <circle cx="3.5" cy="5.5" r="2.8" fill="rgba(255,255,255,0.50)" stroke="none"/>
      <line x1="0" y1="-52" x2="0" y2="-62" opacity=".28"/>
      <line x1="0" y1="-52" x2="-9" y2="-60" opacity=".20"/>
      <line x1="0" y1="-52" x2="9" y2="-60" opacity=".20"/>
      <line x1="-44" y1="36" x2="-54" y2="44" opacity=".25"/>
      <line x1="-44" y1="36" x2="-52" y2="26" opacity=".20"/>
      <line x1="44" y1="36" x2="54" y2="44" opacity=".25"/>
      <line x1="44" y1="36" x2="52" y2="26" opacity=".20"/>
      ${[0,1,2,3,4,5,6,7].map(i=>{const a=i*TAU/8;return`<circle cx="${(Math.cos(a)*52).toFixed(1)}" cy="${(Math.sin(a)*52-2).toFixed(1)}" r="1.2" fill="${GOLD}" stroke="none" opacity=".22"/>`;}).join('')}
    `)
  },

  { cat:'divine', label:'Merkaba',
    art: S('-50 -50 100 100', 82, 82, GOLD, `
      <polygon points="0,-46 -39.8,23 39.8,23" opacity=".80"/>
      <polygon points="0,46 -39.8,-23 39.8,-23" opacity=".80"/>
      <polygon points="0,-23 -19.9,-11.5 -19.9,11.5 0,23 19.9,11.5 19.9,-11.5" opacity=".26"/>
      <circle cx="0" cy="0" r="47" opacity=".10"/>
      ${[0,1,2].map(i=>{
        const a=i*TAU/3-TAU/12;
        const bx=(Math.cos(a)*46).toFixed(1), by=(Math.sin(a)*46).toFixed(1);
        const cx2=(Math.cos(a+Math.PI)*46).toFixed(1), cy2=(Math.sin(a+Math.PI)*46).toFixed(1);
        return `<circle cx="${bx}" cy="${by}" r="2.5" fill="${GOLD}" stroke="none" opacity=".50"/>
                <circle cx="${cx2}" cy="${cy2}" r="2.5" fill="${GOLD}" stroke="none" opacity=".50"/>`;
      }).join('')}
      <circle cx="0" cy="0" r="5" fill="${GOLD}" stroke="none" opacity=".22"/>
    `)
  },

  { cat:'divine', label:'Vesica Piscis',
    art: S('-58 -44 116 88', 88, 74, GOLD, `
      <circle cx="-18" cy="0" r="36" opacity=".38"/>
      <circle cx="18" cy="0" r="36" opacity=".38"/>
      <path d="M 0,-31 A 36,36 0 0 0 0,31 A 36,36 0 0 0 0,-31 Z" opacity=".70"/>
      <line x1="0" y1="-31" x2="0" y2="31" opacity=".52"/>
      <line x1="-54" y1="0" x2="54" y2="0" opacity=".18"/>
      <line x1="-18" y1="-31" x2="18" y2="-31" opacity=".22"/>
      <line x1="-18" y1="31" x2="18" y2="31" opacity=".22"/>
      <circle cx="0" cy="0" r="3.5" fill="${GOLD}" stroke="none" opacity=".42"/>
      <circle cx="0" cy="-31" r="2.2" fill="${GOLD}" stroke="none" opacity=".38"/>
      <circle cx="0" cy="31" r="2.2" fill="${GOLD}" stroke="none" opacity=".38"/>
      <circle cx="-18" cy="0" r="2" fill="${GOLD}" stroke="none" opacity=".28"/>
      <circle cx="18" cy="0" r="2" fill="${GOLD}" stroke="none" opacity=".28"/>
    `)
  },

  { cat:'divine', label:'Caduceus',
    art: S('-34 -62 68 110', 64, 94, GOLD, `
      <line x1="0" y1="-58" x2="0" y2="44"/>
      <circle cx="0" cy="-54" r="5.5" opacity=".85"/>
      <circle cx="0" cy="-54" r="2.5" fill="${GOLD}" stroke="none" opacity=".40"/>
      <path d="M 0,-50 Q -22,-46 -22,-32 Q -22,-18 0,-12 Q 22,-6 22,8 Q 22,22 0,28 Q -22,34 -22,44" opacity=".80"/>
      <path d="M 0,-50 Q 22,-46 22,-32 Q 22,-18 0,-12 Q -22,-6 -22,8 Q -22,22 0,28 Q 22,34 22,44" opacity=".80"/>
      <path d="M 0,-50 Q -26,-54 -28,-44 Q -27,-34 0,-34" opacity=".80"/>
      <path d="M 0,-50 Q 26,-54 28,-44 Q 27,-34 0,-34" opacity=".80"/>
      <circle cx="-22" cy="-32" r="2" fill="${GOLD}" stroke="none" opacity=".30"/>
      <circle cx="22" cy="-32" r="2" fill="${GOLD}" stroke="none" opacity=".30"/>
      <circle cx="0" cy="-12" r="2" fill="${GOLD}" stroke="none" opacity=".30"/>
      <circle cx="22" cy="8" r="2" fill="${GOLD}" stroke="none" opacity=".30"/>
      <circle cx="-22" cy="8" r="2" fill="${GOLD}" stroke="none" opacity=".30"/>
      <line x1="-18" y1="44" x2="18" y2="44" opacity=".28"/>
    `)

// ─── Build cards ──────────────────────────────────────────────────────────────

const stageEl = document.getElementById('stage');
const cards   = [];

function buildCards() {
  CARDS.forEach((def, i) => {
    const el = document.createElement('div');
    el.className = 'card ' + (def.cat || 'core');

    const artDiv = document.createElement('div');
    artDiv.className = 'card-art';
    artDiv.innerHTML = def.art || '';
    el.appendChild(artDiv);

    const content = document.createElement('div');
    content.className = 'card-content';
    if (def.symbol) {
      const s = document.createElement('div');
      s.className = 'card-symbol'; s.textContent = def.symbol;
      content.appendChild(s);
    }
    if (def.text) {
      const t = document.createElement('div');
      t.className = 'card-text ' + (def.textClass || '');
      t.innerHTML = def.text.replace(/\n/g,'<br>');
      content.appendChild(t);
    }
    el.appendChild(content);

    const idx = document.createElement('div');
    idx.className = 'card-index';
    idx.textContent = String(i+1).padStart(2,'0');
    el.appendChild(idx);

    if (def.cat && def.cat !== 'core') {
      const tag = document.createElement('div');
      tag.className = 'card-tag';
      tag.textContent = def.cat.toUpperCase();
      el.appendChild(tag);
    }

    const lbl = document.createElement('div');
    lbl.className = 'card-label';
    lbl.textContent = def.label.toUpperCase();
    el.appendChild(lbl);

    stageEl.appendChild(el);

    const a = (i/CARDS.length)*TAU;
    const r = Math.min(W,H)*0.25;
    const card = {
      el, def, i,
      x:cx, y:cy,
      hx:cx+Math.cos(a)*r, hy:cy+Math.sin(a)*r,
      vx:0, vy:0, rotX:0, rotY:0, rotZ:0, scale:0,
      depth:0.75+Math.random()*0.5,
      phase:Math.random()*TAU,
      floatAmp:2+Math.random()*5,
      floatFreq:0.003+Math.random()*0.004,
      born:false,
    };
    el.style.opacity='0';
    cards.push(card);
  });
}

// ─── Arrangements ─────────────────────────────────────────────────────────────

let orbitOffset = 0; // rotated by wrist roll gesture

const ARRS = {
  drift(cards, t) {
    cards.forEach((c,i) => {
      const a = (i/cards.length)*TAU + t*0.00008 + orbitOffset;
      c.hx = cx + Math.cos(a)*Math.min(W,H)*0.25;
      c.hy = cy + Math.sin(a)*Math.min(W,H)*0.25;
    });
  },
  grid(cards) {
    const cols=Math.ceil(Math.sqrt(cards.length)), pw=136, ph=190;
    const ox=-(cols-1)*pw/2, oy=-(Math.ceil(cards.length/cols)-1)*ph/2;
    cards.forEach((c,i)=>{ c.hx=cx+ox+(i%cols)*pw; c.hy=cy+oy+Math.floor(i/cols)*ph; c.rotZ=0; });
  },
  divine(cards) {
    const d=cards.filter(c=>c.def.cat==='divine'), o=cards.filter(c=>c.def.cat!=='divine');
    d.forEach((c,i)=>{ const a=i*TAU/d.length-TAU/4+orbitOffset; c.hx=cx+Math.cos(a)*Math.min(W,H)*0.28; c.hy=cy+Math.sin(a)*Math.min(W,H)*0.28; c.rotZ=0; });
    o.forEach((c,i)=>{ const a=i*TAU/o.length+orbitOffset; c.hx=cx+Math.cos(a)*Math.min(W,H)*0.12; c.hy=cy+Math.sin(a)*Math.min(W,H)*0.12; c.rotZ=0; });
  },
  forest(cards) {
    const f=cards.filter(c=>c.def.cat==='forest'), o=cards.filter(c=>c.def.cat!=='forest');
    f.forEach((c,i)=>{ const a=i*TAU/f.length-TAU/4+orbitOffset; c.hx=cx+Math.cos(a)*Math.min(W,H)*0.28; c.hy=cy+Math.sin(a)*Math.min(W,H)*0.28; c.rotZ=0; });
    o.forEach((c,i)=>{ const a=i*TAU/o.length+orbitOffset; c.hx=cx+Math.cos(a)*Math.min(W,H)*0.12; c.hy=cy+Math.sin(a)*Math.min(W,H)*0.12; c.rotZ=0; });
  },
  garden(cards) {
    const g=cards.filter(c=>c.def.cat==='garden'), o=cards.filter(c=>c.def.cat!=='garden');
    g.forEach((c,i)=>{ const a=i*TAU/g.length-TAU/4+orbitOffset; c.hx=cx+Math.cos(a)*Math.min(W,H)*0.28; c.hy=cy+Math.sin(a)*Math.min(W,H)*0.28; c.rotZ=0; });
    o.forEach((c,i)=>{ const a=i*TAU/o.length+orbitOffset; c.hx=cx+Math.cos(a)*Math.min(W,H)*0.12; c.hy=cy+Math.sin(a)*Math.min(W,H)*0.12; c.rotZ=0; });
  },
  fan(cards) {
    const n=cards.length, fw=Math.min(W*0.86,n*36);
    cards.forEach((c,i)=>{
      const p=n>1?i/(n-1):0.5;
      c.hx=cx-fw/2+p*fw; c.hy=cy*1.06+Math.sin(p*Math.PI)*-H*0.13; c.rotZ=(p-0.5)*22;
    });
  },
  stack(cards) {
    cards.forEach((c,i)=>{ c.hx=cx+(i-cards.length/2)*1.8; c.hy=cy+(i-cards.length/2)*0.9; c.rotZ=(i-cards.length/2)*2.8; });
  },
  spiral(cards) {
    cards.forEach((c,i)=>{ const a=i*0.72*TAU+orbitOffset, r=12+i*13; c.hx=cx+Math.cos(a)*r; c.hy=cy+Math.sin(a)*r; c.rotZ=0; });
  },
};
const ARR_KEYS = Object.keys(ARRS);
let arrIdx=0, currentArr='drift';

function setArr(name) {
  if (!ARRS[name]) return;
  currentArr=name; arrIdx=ARR_KEYS.indexOf(name);
  if (!['fan','stack'].includes(name)) cards.forEach(c=>{ c.rotZ=0; });
  document.getElementById('hud-l').textContent=name.toUpperCase();
}

// ─── Physics (pure spring, no pointer) ───────────────────────────────────────

const K=0.052, DMP=0.79;

function tick(t) {
  ARRS[currentArr](cards, t);
  cards.forEach(c => {
    if (!c.born) return;
    c.vx = (c.vx + (c.hx-c.x)*K*(0.65+0.5*c.depth)) * DMP;
    c.vy = (c.vy + (c.hy-c.y)*K*(0.65+0.5*c.depth)) * DMP;
    c.x += c.vx; c.y += c.vy;
    const fx = Math.cos(t*c.floatFreq+c.phase)*c.floatAmp*0.38;
    const fy = Math.sin(t*c.floatFreq*1.3+c.phase)*c.floatAmp;
    c.rotX *= 0.97; c.rotY *= 0.97;
    c.scale = c.scale*0.94 + 1.0*0.06;
    c.el.style.transform =
      `translate(calc(${c.x+fx}px - 50%), calc(${c.y+fy}px - 50%))
       rotateX(${c.rotX.toFixed(2)}deg) rotateY(${c.rotY.toFixed(2)}deg)
       rotateZ(${c.rotZ.toFixed(2)}deg) scale(${c.scale.toFixed(4)})`;
    c.el.style.opacity = (0.62+c.depth*0.38).toFixed(2);
    c.el.style.zIndex  = Math.round(c.depth*10);
  });
}

function scatter() {
  cards.forEach(c => {
    if (!c.born) return;
    const ang=Math.atan2(c.y-cy,c.x-cx), f=7+Math.random()*11;
    c.vx+=Math.cos(ang)*f; c.vy+=Math.sin(ang)*f;
  });
}

// ─── Touch flash ─────────────────────────────────────────────────────────────

let flashTimer=null;
function flash(txt) {
  const el=document.getElementById('touch-flash');
  el.textContent=txt; el.style.color='rgba(255,255,255,0.65)';
  clearTimeout(flashTimer);
  flashTimer=setTimeout(()=>{ el.style.color='rgba(255,255,255,0)'; },1100);
  document.getElementById('hud-t') && (document.getElementById('hud-t').textContent=txt);
}

// ─── Gesture-based hand tracking ──────────────────────────────────────────────

const videoEl  = document.getElementById('cam-video');
const camCv    = document.getElementById('cam-canvas');
const camCtx   = camCv.getContext('2d');
const CONN = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[0,9],[9,10],[10,11],[11,12],
              [0,13],[13,14],[14,15],[15,16],[0,17],[17,18],[18,19],[19,20],[5,9],[9,13],[13,17]];

// Smoothing
let smoothLM=null, noHandFrames=0;
const LM_SMOOTH=0.38, NO_HAND_GRACE=10;

function applyLMSmooth(raw) {
  if (!smoothLM||smoothLM.length!==raw.length) {
    smoothLM=raw.map(p=>({x:p.x,y:p.y,z:p.z||0})); return smoothLM;
  }
  for(let i=0;i<raw.length;i++){
    smoothLM[i].x+=(raw[i].x-smoothLM[i].x)*LM_SMOOTH;
    smoothLM[i].y+=(raw[i].y-smoothLM[i].y)*LM_SMOOTH;
    smoothLM[i].z+=((raw[i].z||0)-smoothLM[i].z)*LM_SMOOTH;
  }
  return smoothLM;
}

// Gesture state
let gestHold=0, lastGest='none', confirmedGest='none', gestCooldown=0;
// Wrist roll state
let prevHandAngle=null;
// Swipe state
let handVelX=0, lastHandCX=null, swipeCooldown=0;
// Total orbit degrees for HUD
let orbitDeg=0;

function classifyGesture(lm) {
  const ext=(t,m)=>lm[t].y<lm[m].y-0.04;
  const ie=ext(8,5),me=ext(12,9),re=ext(16,13),pe=ext(20,17);
  const pd=Math.hypot(lm[4].x-lm[8].x,lm[4].y-lm[8].y);
  if(pd<0.065){const sp=[ie,me,re,pe].filter(Boolean).length;return sp>=3?'ok':'pinch';}
  if(ie&&pe&&!me&&!re) return 'rock';
  if(ie&&me&&!re&&!pe) return 'peace';
  if(ie&&!me&&!re&&!pe) return 'point';
  if([ie,me,re,pe].filter(Boolean).length===4) return 'open';
  if([ie,me,re,pe].filter(Boolean).length===0) return 'fist';
  return 'none';
}

function onHandResults(results) {
  const vw=videoEl.videoWidth||320, vh=videoEl.videoHeight||240;
  if(camCv.width!==vw||camCv.height!==vh){ camCv.width=vw; camCv.height=vh; }
  camCtx.clearRect(0,0,camCv.width,camCv.height);

  if(!results.multiHandLandmarks?.length){
    noHandFrames++;
    if(noHandFrames>=NO_HAND_GRACE){
      smoothLM=null; prevHandAngle=null; lastHandCX=null; handVelX=0;
      document.getElementById('cam-label').textContent='○ SEARCHING';
      document.getElementById('gest-glyph').textContent='—';
    }
    return;
  }
  noHandFrames=0;
  document.getElementById('cam-label').textContent='● TRACKING';

  const lm=applyLMSmooth(results.multiHandLandmarks[0]);
  const cw=camCv.width, ch=camCv.height;

  // Skeleton overlay on pip cam
  CONN.forEach(([a,b])=>{
    camCtx.beginPath();
    camCtx.moveTo(lm[a].x*cw,lm[a].y*ch);
    camCtx.lineTo(lm[b].x*cw,lm[b].y*ch);
    camCtx.strokeStyle='rgba(160,220,140,0.55)'; camCtx.lineWidth=1.1; camCtx.stroke();
  });
  [4,8,12,16,20].forEach(i=>{
    camCtx.beginPath(); camCtx.arc(lm[i].x*cw,lm[i].y*ch,2.8,0,TAU);
    camCtx.fillStyle='rgba(220,255,200,0.90)'; camCtx.fill();
  });

  // ── WRIST ROLL → orbit offset ──────────────────────────────────────────────
  // Use angle of wrist (lm[0]) → middle MCP (lm[9]) axis
  const rawAngle = Math.atan2(lm[9].y-lm[0].y, lm[9].x-lm[0].x);
  if (prevHandAngle !== null) {
    let dA = rawAngle - prevHandAngle;
    if (dA >  Math.PI) dA -= TAU;
    if (dA < -Math.PI) dA += TAU;
    // Only accumulate meaningful increments (filter noise)
    if (Math.abs(dA) < 0.10 && Math.abs(dA) > 0.004) {
      orbitOffset += dA * 0.28;
      orbitDeg = Math.round(orbitOffset * 180/Math.PI) % 360;
      document.getElementById('hud-r').textContent = orbitDeg + '°';
    }
  }
  prevHandAngle = rawAngle;

  // ── LATERAL SWIPE → cycle layout ──────────────────────────────────────────
  // Track horizontal center of wrist+mid for swipe
  const hcx = (lm[0].x + lm[9].x) * 0.5;
  if (lastHandCX !== null && swipeCooldown <= 0) {
    const dx = hcx - lastHandCX;
    handVelX = handVelX*0.65 + dx*0.35;
    if (Math.abs(handVelX) > 0.028) {
      // Mirrored: camera x is flipped, so positive dx = moving right on screen
      const dir = handVelX > 0 ? 1 : -1;
      arrIdx = (arrIdx + dir + ARR_KEYS.length) % ARR_KEYS.length;
      setArr(ARR_KEYS[arrIdx]);
      flash((dir>0?'→ ':'← ') + ARR_KEYS[arrIdx].toUpperCase());
      swipeCooldown = 55; handVelX = 0;
    }
  }
  lastHandCX = hcx;
  if (swipeCooldown > 0) swipeCooldown--;

  // ── HELD GESTURE → layout change ──────────────────────────────────────────
  const g = classifyGesture(lm);
  if (g === lastGest) { gestHold++; } else { gestHold=0; lastGest=g; }

  if (gestHold === 5) {
    confirmedGest = g;
    document.getElementById('hud-g').textContent = g.toUpperCase();
    document.getElementById('gest-glyph').textContent = g.toUpperCase();
  }

  // Trigger layout on hold — one trigger per gesture episode
  if (gestHold === 10 && gestCooldown <= 0) {
    const LAY = {
      open:'drift', fist:'stack', peace:'fan',
      rock:'divine', point:'spiral', ok:'garden', pinch:'grid'
    };
    const lay = LAY[g];
    if (lay && lay !== currentArr) {
      setArr(lay); flash(lay.toUpperCase()); gestCooldown = 70;
    }
  }
  if (gestCooldown > 0) gestCooldown--;

  // Scatter on fast open-palm flick (open gesture + high wrist velocity)
  if (g === 'open' && gestHold === 2) {
    const wristVel = Math.abs(lm[0].y - (prevHandAngle !== null ? lm[0].y : lm[0].y));
    // Use horizontal wrist speed as a proxy for flick
    if (Math.abs(handVelX) > 0.045 && swipeCooldown <= 0) {
      scatter(); flash('SCATTER');
    }
  }
}

// ─── Camera start ─────────────────────────────────────────────────────────────

function startCamera() {
  const hands=new Hands({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`});
  hands.setOptions({maxNumHands:1,modelComplexity:1,minDetectionConfidence:0.68,minTrackingConfidence:0.55});
  hands.onResults(onHandResults);
  const cam=new Camera(videoEl,{
    onFrame:async()=>{
      const vw=videoEl.videoWidth||320, vh=videoEl.videoHeight||240;
      if(camCv.width!==vw||camCv.height!==vh){camCv.width=vw;camCv.height=vh;}
      await hands.send({image:videoEl});
    },
    width:640, height:480,
  });
  cam.start().then(()=>{
    document.getElementById('cam-wrap').style.opacity='0.88';
    const p=document.getElementById('perm'); p.style.opacity='0';
    setTimeout(()=>p.style.display='none',600);
  }).catch(skipCam);
}
function skipCam() {
  const p=document.getElementById('perm'); p.style.opacity='0';
  setTimeout(()=>p.style.display='none',600);
}
document.getElementById('perm-btn').addEventListener('click',startCamera);
document.getElementById('skip-btn').addEventListener('click',skipCam);

// ─── Keyboard ─────────────────────────────────────────────────────────────────

window.addEventListener('keydown',e=>{
  const m={'1':'drift','2':'grid','3':'fan','4':'stack','5':'spiral','6':'divine','7':'forest','8':'garden'};
  if(m[e.key]) { setArr(m[e.key]); flash(m[e.key].toUpperCase()); }
  if(e.key===' '){ e.preventDefault(); scatter(); flash('SCATTER'); }
  if(e.key==='Tab'){ e.preventDefault(); arrIdx=(arrIdx+1)%ARR_KEYS.length; setArr(ARR_KEYS[arrIdx]); flash(ARR_KEYS[arrIdx].toUpperCase()); }
  if(e.key==='ArrowLeft')  { orbitOffset-=0.15; }
  if(e.key==='ArrowRight') { orbitOffset+=0.15; }
});

window.addEventListener('resize',()=>{
  W=innerWidth; H=innerHeight; cx=W/2; cy=H/2;
  bgCv.width=W; bgCv.height=H;
  const ic=document.getElementById('intro');
  if(ic.style.display!=='none'){ ic.width=W; ic.height=H; }
});

// ─── Main loop ────────────────────────────────────────────────────────────────

let frame=0, introActive=true;
function loop(ts) {
  requestAnimationFrame(loop); frame++;
  drawGarden(ts);
  if (!introActive) tick(ts);
}

// ─── Divine intro sequence ────────────────────────────────────────────────────

function spawnCards() {
  introActive = false;
  cards.forEach((c,i) => {
    setTimeout(()=>{
      c.x  = cx + (Math.random()-0.5)*50;
      c.y  = cy + (Math.random()-0.5)*50;
      c.vx = (Math.random()-0.5)*16;
      c.vy = (Math.random()-0.5)*12;
      c.scale = 0.12;
      c.born  = true;
      c.el.style.transition='opacity 0.55s ease-out';
    }, i*58+80);
  });
}

function runIntro() {
  const cv  = document.getElementById('intro');
  const ctx = cv.getContext('2d');
  cv.width  = W; cv.height = H;

  const sparks = Array.from({length:44},()=>({
    a:Math.random()*TAU, r:22+Math.random()*108,
    s:0.28+Math.random()*0.72, ph:Math.random()*TAU,
  }));

  const DUR=4600, START=performance.now();

  function drawIntroRing(t,r,tS,tE,ccw,op){
    const p=Math.max(0,Math.min((t-tS)/(tE-tS),1));
    if(p<=0) return;
    const ox=W/2,oy=H/2,a0=-Math.PI/2;
    ctx.beginPath();
    ctx.arc(ox,oy,r,a0,a0+(ccw?-1:1)*Math.PI*2*p,ccw);
    ctx.strokeStyle=`rgba(255,214,90,${op})`; ctx.lineWidth=0.75; ctx.stroke();
  }

  function frame(now){
    const t=Math.min((now-START)/DUR,1);
    const bgAlpha=t<0.64?1:Math.max(0,1-(t-0.64)/0.36);
    const gAlpha=t<0.64?Math.min(t/0.07,1):Math.max(0,1-(t-0.64)/0.28);

    ctx.clearRect(0,0,W,H);
    if(bgAlpha>0.005){ ctx.fillStyle=`rgba(5,3,12,${bgAlpha})`; ctx.fillRect(0,0,W,H); }

    const ox=W/2,oy=H/2;

    if(gAlpha>0.005){
      ctx.save(); ctx.globalAlpha=gAlpha;
      const cg=ctx.createRadialGradient(ox,oy,0,ox,oy,68);
      cg.addColorStop(0,'rgba(255,235,140,0.38)'); cg.addColorStop(0.4,'rgba(255,218,90,0.12)'); cg.addColorStop(1,'rgba(255,195,50,0)');
      ctx.fillStyle=cg; ctx.fillRect(0,0,W,H);

      drawIntroRing(t,40,0.04,0.30,false,0.62);
      drawIntroRing(t,68,0.10,0.36,true, 0.46);
      drawIntroRing(t,98,0.17,0.43,false,0.30);
      drawIntroRing(t,130,0.23,0.50,true, 0.17);
      drawIntroRing(t,162,0.28,0.56,false,0.10);

      const lineP=Math.max(0,Math.min((t-0.14)/0.26,1));
      if(lineP>0){
        for(let i=0;i<6;i++){
          const a=i*Math.PI/3-Math.PI/6;
          ctx.beginPath(); ctx.moveTo(ox,oy);
          ctx.lineTo(ox+Math.cos(a)*148*lineP,oy+Math.sin(a)*148*lineP);
          ctx.strokeStyle=`rgba(255,218,100,${0.18*lineP})`; ctx.lineWidth=0.65; ctx.stroke();
        }
      }

      const dotP=Math.max(0,Math.min((t-0.28)/0.18,1));
      if(dotP>0){
        for(let i=0;i<6;i++){
          const a=i*Math.PI/3-Math.PI/6;
          ctx.beginPath(); ctx.arc(ox+Math.cos(a)*68,oy+Math.sin(a)*68,3.2*dotP,0,TAU);
          ctx.strokeStyle=`rgba(255,225,130,${0.62*dotP})`; ctx.lineWidth=0.75; ctx.stroke();
        }
        const d2P=Math.max(0,Math.min((t-0.34)/0.14,1));
        if(d2P>0) for(let i=0;i<12;i++){
          const a=i*Math.PI/6;
          ctx.beginPath(); ctx.arc(ox+Math.cos(a)*130,oy+Math.sin(a)*130,1.8*d2P,0,TAU);
          ctx.strokeStyle=`rgba(255,230,150,${0.38*d2P})`; ctx.lineWidth=0.6; ctx.stroke();
        }
      }

      const chordP=Math.max(0,Math.min((t-0.34)/0.22,1));
      if(chordP>0) for(let i=0;i<6;i++){
        const a1=i*Math.PI/3-Math.PI/6, a2=(i+2)*Math.PI/3-Math.PI/6;
        const x1=ox+Math.cos(a1)*68,y1=oy+Math.sin(a1)*68;
        const x2=ox+Math.cos(a2)*68,y2=oy+Math.sin(a2)*68;
        ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x1+(x2-x1)*chordP,y1+(y2-y1)*chordP);
        ctx.strokeStyle=`rgba(255,220,110,${0.20*chordP})`; ctx.lineWidth=0.6; ctx.stroke();
      }

      const spkP=Math.max(0,Math.min((t-0.22)/0.32,1))*(t<0.58?1:Math.max(0,1-(t-0.58)/0.14));
      if(spkP>0) sparks.forEach(sp=>{
        const sx=ox+Math.cos(sp.a+t*0.28)*sp.r, sy=oy+Math.sin(sp.a+t*0.28*sp.s)*sp.r*0.65;
        const bri=(Math.sin(t*7*sp.s+sp.ph)*0.5+0.5)*spkP;
        if(bri<0.02) return;
        ctx.beginPath(); ctx.arc(sx,sy,1,0,TAU);
        ctx.fillStyle=`rgba(255,235,155,${bri*0.72})`; ctx.fill();
      });

      ctx.restore();
    }

    const textAlpha=t>0.37?Math.min((t-0.37)/0.16,1)*(t<0.60?1:Math.max(0,1-(t-0.60)/0.32)):0;
    if(textAlpha>0.01){
      ctx.save(); ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.font='300 20px "Courier New", monospace';
      const letters='EUDAIMON'.split(''), spacing=24, totalW=(letters.length-1)*spacing;
      letters.forEach((ch,li)=>{
        const lT=Math.max(0,Math.min((t-0.37-li*0.012)/0.10,1))*textAlpha;
        if(lT>0.01){
          ctx.save(); ctx.shadowColor='rgba(255,210,80,0.7)'; ctx.shadowBlur=18;
          ctx.fillStyle=`rgba(255,248,215,${lT})`;
          ctx.fillText(ch, ox-totalW/2+li*spacing, oy-16);
          ctx.restore();
        }
      });
      const subA=t>0.50?Math.min((t-0.50)/0.12,1)*textAlpha:0;
      if(subA>0.01){
        ctx.font='300 7.5px "Courier New", monospace';
        ctx.fillStyle=`rgba(255,232,172,${subA*0.48})`;
        ctx.fillText('G A R D E N  ·  2 0 2 6',ox,oy+16);
      }
      ctx.restore();
    }

    if(t<1){ requestAnimationFrame(frame); }
    else { cv.style.display='none'; spawnCards(); }
  }
  requestAnimationFrame(frame);
}

// ─── Init ─────────────────────────────────────────────────────────────────────

bgCv.width=W; bgCv.height=H;
buildCards();
setArr('drift');
requestAnimationFrame(loop);
runIntro();
</script>
